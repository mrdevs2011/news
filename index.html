<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIRE // Live Yangiliklar Terminali</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&display=swap');

  :root{
    --paper:#0d0d0c;
    --paper-raised:#161613;
    --ink:#ecebe4;
    --ink-dim:#8a8a7d;
    --wire-red:#c23b2e;
    --wire-amber:#d9a441;
    --wire-green:#5a9b6f;
    --line:#2a2a24;
    --mono: 'JetBrains Mono', monospace;
    --serif: 'Newsreader', serif;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== HEADER / MASTHEAD ===== */
  header{
    border-bottom:3px double var(--line);
    padding:20px 24px 14px;
    position:sticky;
    top:0;
    background:var(--paper);
    z-index:50;
  }

  .masthead-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-bottom:14px;
    flex-wrap:wrap;
    gap:6px;
  }

  #clock{color:var(--wire-amber); font-weight:700;}
  #aiStatus{color:var(--ink-dim);}
  #aiStatus.ok{color:var(--wire-green);}
  #aiStatus.bad{color:var(--wire-red);}

  .masthead-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }

  h1{
    font-family:var(--mono);
    font-weight:800;
    font-size:clamp(28px,6vw,46px);
    letter-spacing:-0.02em;
    display:flex;
    align-items:center;
    gap:10px;
  }
  h1 span.blink{
    width:10px;height:10px;border-radius:50%;
    background:var(--wire-red);
    display:inline-block;
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(194,59,46,.5);}
    50%{opacity:.4;box-shadow:0 0 0 6px rgba(194,59,46,0);}
  }

  .status-line{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    text-transform:uppercase;
    letter-spacing:0.05em;
  }

  /* ===== TABS ===== */
  .tabs{
    display:flex;
    gap:0;
    margin-top:16px;
    border:1px solid var(--line);
  }
  .tab-btn{
    flex:1;
    background:transparent;
    border:none;
    color:var(--ink-dim);
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    padding:10px 8px;
    cursor:pointer;
    border-right:1px solid var(--line);
    transition:.15s;
  }
  .tab-btn:last-child{border-right:none;}
  .tab-btn:hover{color:var(--ink); background:var(--paper-raised);}
  .tab-btn.active{
    background:var(--wire-red);
    color:#fff;
    font-weight:700;
  }

  /* ===== MAIN FEED ===== */
  main{
    max-width:900px;
    margin:0 auto;
    padding:24px 20px 80px;
  }

  #feed-meta{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    text-transform:uppercase;
    letter-spacing:.06em;
    margin-bottom:18px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
  }

  .story{
    padding:22px 0;
    border-bottom:1px solid var(--line);
    display:grid;
    grid-template-columns:90px 1fr;
    gap:18px;
  }
  .story:first-of-type{padding-top:0;}

  .story-index{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    padding-top:4px;
  }
  .story-index .src{
    display:block;
    color:var(--wire-amber);
    font-weight:700;
    margin-top:4px;
    text-transform:uppercase;
    font-size:10px;
  }

  .story h2{
    font-family:var(--serif);
    font-weight:600;
    font-size:20px;
    line-height:1.3;
    margin-bottom:8px;
  }
  .story h2 a{color:var(--ink); text-decoration:none;}
  .story h2 a:hover{color:var(--wire-amber);}

  .story p.desc{
    font-size:14.5px;
    line-height:1.55;
    color:#c9c8bd;
    font-style:italic;
  }

  .story .meta{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-dim);
    margin-top:10px;
    text-transform:uppercase;
    letter-spacing:.04em;
  }

  /* ---- AI block ---- */
  .ai-toolbar{
    display:flex;
    gap:8px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .ai-btn{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-dim);
    padding:6px 10px;
    cursor:pointer;
    transition:.15s;
  }
  .ai-btn:hover{border-color:var(--wire-amber); color:var(--wire-amber);}
  .ai-btn:disabled{opacity:.4; cursor:wait;}

  .ai-panel{
    margin-top:12px;
    border-left:2px solid var(--wire-amber);
    padding:10px 14px;
    background:var(--paper-raised);
    display:none;
  }
  .ai-panel.show{display:block;}
  .ai-panel .ai-tag{
    font-family:var(--mono);
    font-size:9.5px;
    color:var(--wire-amber);
    text-transform:uppercase;
    letter-spacing:.08em;
    margin-bottom:6px;
    display:flex;
    justify-content:space-between;
  }
  .ai-panel .ai-body{
    font-family:var(--serif);
    font-size:14.5px;
    line-height:1.6;
    color:var(--ink);
    white-space:pre-wrap;
  }

  .chat-panel{
    margin-top:10px;
    display:none;
  }
  .chat-panel.show{display:block;}
  .chat-log{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:8px;
    max-height:340px;
    overflow-y:auto;
  }
  .chat-msg{
    font-family:var(--serif);
    font-size:13.5px;
    line-height:1.5;
    padding:8px 10px;
    border-radius:2px;
  }
  .chat-msg.user{
    background:var(--paper-raised);
    color:var(--ink);
    align-self:flex-end;
    max-width:85%;
    border:1px solid var(--line);
  }
  .chat-msg.ai{
    background:transparent;
    color:#c9c8bd;
    border-left:2px solid var(--wire-green);
    padding-left:10px;
    white-space:pre-wrap;
  }
  .chat-input-row{
    display:flex;
    gap:6px;
  }
  .chat-input-row input{
    flex:1;
    background:var(--paper);
    border:1px solid var(--line);
    color:var(--ink);
    padding:8px 10px;
    font-family:var(--serif);
    font-size:13.5px;
  }
  .chat-input-row input:focus{outline:1px solid var(--wire-amber);}
  .chat-input-row button{
    background:var(--wire-amber);
    border:none;
    color:#0d0d0c;
    padding:0 14px;
    font-family:var(--mono);
    font-weight:700;
    font-size:11px;
    cursor:pointer;
    text-transform:uppercase;
  }
  .chat-input-row button:disabled{opacity:.5; cursor:wait;}

  /* ===== LOADING / EMPTY ===== */
  .placeholder{
    font-family:var(--mono);
    text-align:center;
    padding:60px 20px;
    color:var(--ink-dim);
    font-size:13px;
    line-height:1.8;
  }
  .placeholder .cursor{
    display:inline-block;
    width:8px;height:14px;
    background:var(--wire-amber);
    animation:blink 1s step-end infinite;
    vertical-align:middle;
    margin-left:4px;
  }
  @keyframes blink{50%{opacity:0;}}

  .error-box{
    border:1px solid var(--wire-red);
    background:rgba(194,59,46,.08);
    padding:16px;
    font-family:var(--mono);
    font-size:12px;
    color:#e2a29b;
    line-height:1.6;
  }

  footer{
    text-align:center;
    font-family:var(--mono);
    font-size:10px;
    color:var(--ink-dim);
    padding:24px;
    border-top:1px solid var(--line);
    text-transform:uppercase;
    letter-spacing:.08em;
  }

  @media (max-width:600px){
    .story{grid-template-columns:1fr; gap:6px;}
    .story-index{display:flex; gap:8px; align-items:center;}
    .story-index .src{margin-top:0;}
  }
</style>
</head>
<body>

<header>
  <div class="masthead-top">
    <span>ESTABLISHED TODAY // AUTO-REFRESH: 30 MIN</span>
    <span id="aiStatus">AI: TEKSHIRILMOQDA...</span>
    <span id="clock">--:--:--</span>
  </div>
  <div class="masthead-title">
    <h1><span class="blink"></span>WIRE</h1>
    <div class="status-line" id="statusLine">TERMINAL IDLE</div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-mode="global">🌍 Global</button>
    <button class="tab-btn" data-mode="local">🇺🇿 O'zbekiston</button>
  </div>
</header>

<main>
  <div id="feed-meta">
    <span id="feedLabel">GLOBAL FEED</span>
    <span id="feedCount">0 TA YANGILIK</span>
  </div>
  <div id="feed">
    <div class="placeholder">YUKLANMOQDA<span class="cursor"></span></div>
  </div>
</main>

<footer>WIRE TERMINAL — GNews (server proxy) + AI (Groq → OpenRouter → Gemini) — GNews key Vercel env'da, AI key'lar config.local.js ichida</footer>

<!--
  Bratan: GNews key endi bu yerda YO'Q — u Vercel Environment Variables
  ichida, /api/gnews.js orqali server tomonda ishlatiladi. Frontend
  uni hech qachon ko'rmaydi.

  AI key'lar (groq/openrouter/gemini) hali ham config.local.js da —
  bu HALI HAM xavfli agar public deploy qilsang. Bu haqida alohida
  gaplashamiz keyingi qadamda.
-->
<script src="config.local.js"></script>

<script>
(function(){
  // =========================================================
  // 0) CONFIG / KEY POOLS
  // =========================================================
  const CFG = window.WIRE_KEYS || {};
  const KEY_POOLS = {
    groq: Array.isArray(CFG.groq) ? CFG.groq.filter(Boolean) : [],
    openrouter: Array.isArray(CFG.openrouter) ? CFG.openrouter.filter(Boolean) : [],
    gemini: Array.isArray(CFG.gemini) ? CFG.gemini.filter(Boolean) : []
  };
  // fallback tartibi — shu ketma-ketlikda sinaladi
  const PROVIDER_ORDER = ['groq', 'openrouter', 'gemini'];

  // har provider uchun round-robin pointer
  const keyCursor = { groq: 0, openrouter: 0, gemini: 0 };
  // ishlamay qolgan (dead) key'larni shu turda belgilaymiz — session davomida qayta sinamaymiz
  const deadKeys = { groq: new Set(), openrouter: new Set(), gemini: new Set() };

  function nextKey(provider){
    const pool = KEY_POOLS[provider];
    if(!pool.length) return null;
    const dead = deadKeys[provider];
    if(dead.size >= pool.length) return null; // hammasi o'lgan
    for(let i=0; i<pool.length; i++){
      const idx = keyCursor[provider] % pool.length;
      keyCursor[provider]++;
      if(!dead.has(idx)) return { key: pool[idx], idx };
    }
    return null;
  }

  function markDead(provider, idx){
    deadKeys[provider].add(idx);
  }

  function poolsExhausted(){
    return PROVIDER_ORDER.every(p => {
      const pool = KEY_POOLS[p];
      return pool.length === 0 || deadKeys[p].size >= pool.length;
    });
  }

  // =========================================================
  // 1) AI CALL LAYER — provider-agnostic chat completion
  //    Fallback zanjiri: groq -> openrouter -> gemini
  //    Har provider ichida key'lar round-robin bilan sinaladi
  // =========================================================
  async function callGroq(key, messages){
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${key}`
      },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        messages,
        temperature: 0.4
      })
    });
    if(!res.ok){
      const body = await res.json().catch(()=>({}));
      const err = new Error(body.error?.message || `HTTP ${res.status}`);
      err.status = res.status;
      throw err;
    }
    const data = await res.json();
    return data.choices?.[0]?.message?.content?.trim() || '';
  }

  async function callOpenRouter(key, messages){
    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${key}`
      },
      body: JSON.stringify({
        model: 'meta-llama/llama-3.3-70b-instruct:free',
        messages,
        temperature: 0.4
      })
    });
    if(!res.ok){
      const body = await res.json().catch(()=>({}));
      const err = new Error(body.error?.message || `HTTP ${res.status}`);
      err.status = res.status;
      throw err;
    }
    const data = await res.json();
    return data.choices?.[0]?.message?.content?.trim() || '';
  }

  async function callGemini(key, messages){
    // Gemini API tuzilishi boshqacha — system+user'ni birlashtiramiz
    const sysMsg = messages.find(m => m.role === 'system');
    const convo = messages.filter(m => m.role !== 'system');
    const contents = convo.map(m => ({
      role: m.role === 'assistant' ? 'model' : 'user',
      parts: [{ text: m.content }]
    }));
    const body = {
      contents,
      ...(sysMsg ? { systemInstruction: { parts: [{ text: sysMsg.content }] } } : {})
    };
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${encodeURIComponent(key)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if(!res.ok){
      const errBody = await res.json().catch(()=>({}));
      const err = new Error(errBody.error?.message || `HTTP ${res.status}`);
      err.status = res.status;
      throw err;
    }
    const data = await res.json();
    return data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || '';
  }

  const CALLERS = { groq: callGroq, openrouter: callOpenRouter, gemini: callGemini };

  // status bar'ga hozir qaysi provider ishlatilayotganini chiqaramiz
  function setAiStatus(text, cls){
    const el = document.getElementById('aiStatus');
    el.textContent = 'AI: ' + text;
    el.className = cls || '';
  }

  // asosiy funksiya: fallback zanjiri bo'ylab AI'dan javob so'raydi
  async function aiChat(messages){
    if(poolsExhausted()){
      throw new Error('Barcha AI key\'lar (Groq/OpenRouter/Gemini) tugadi yoki ishlamayapti.');
    }
    let lastErr = null;
    for(const provider of PROVIDER_ORDER){
      const pool = KEY_POOLS[provider];
      if(!pool.length) continue;
      // shu provider ichidagi key'larni birma-bir sinaymiz
      let attempts = 0;
      const maxAttempts = pool.length;
      while(attempts < maxAttempts){
        const picked = nextKey(provider);
        if(!picked) break; // bu provider'ning hammasi dead
        attempts++;
        try{
          setAiStatus(provider.toUpperCase() + ' bilan ishlamoqda...', '');
          const result = await CALLERS[provider](picked.key, messages);
          setAiStatus(provider.toUpperCase() + ' — ISHLAYAPTI', 'ok');
          return result;
        }catch(err){
          console.warn(`[${provider}] key#${picked.idx} xato:`, err.message);
          // 401/403 = key yaroqsiz, 429 = limit tugagan — ikkalasida ham dead deb belgilaymiz
          if(err.status === 401 || err.status === 403 || err.status === 429){
            markDead(provider, picked.idx);
          }
          lastErr = err;
          continue; // shu provider ichida keyingi key'ga o'tamiz
        }
      }
      // shu provider'ning key pool'i butunlay tugadi -> keyingi provider'ga o'tamiz
    }
    setAiStatus('HAMMASI TUGADI', 'bad');
    throw lastErr || new Error('AI javob bermadi — barcha provider/key sinaldi.');
  }

  // ilk holatda AI mavjudligini ko'rsatib qo'yamiz
  (function initAiStatus(){
    const total = KEY_POOLS.groq.length + KEY_POOLS.openrouter.length + KEY_POOLS.gemini.length;
    if(total === 0){
      setAiStatus('KEY YO\'Q (config.local.js)', 'bad');
    } else {
      setAiStatus(`TAYYOR (${KEY_POOLS.groq.length}G/${KEY_POOLS.openrouter.length}OR/${KEY_POOLS.gemini.length}GM)`, '');
    }
  })();

  // =========================================================
  // 2) GNEWS FEED
  // =========================================================
  const feedEl = document.getElementById('feed');
  const feedLabel = document.getElementById('feedLabel');
  const feedCount = document.getElementById('feedCount');
  const statusLine = document.getElementById('statusLine');
  const tabs = document.querySelectorAll('.tab-btn');

  let currentMode = 'global';
  let refreshTimer = null;
  let currentArticles = []; // hozirgi feed'dagi maqolalar, AI context uchun

  function tickClock(){
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('uz-UZ', {hour12:false});
  }
  tickClock();
  setInterval(tickClock, 1000);

  tabs.forEach(btn => {
    btn.addEventListener('click', () => {
      tabs.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
      feedLabel.textContent = currentMode === 'global' ? 'GLOBAL FEED' : "O'ZBEKISTON FEED";
      loadFeed();
    });
  });

  async function loadFeed(){
    statusLine.textContent = 'YUKLANMOQDA...';
    feedEl.innerHTML = '<div class="placeholder">SO\'ROV YUBORILMOQDA<span class="cursor"></span></div>';

    const url = `/api/gnews?mode=${currentMode}`;

    try{
      const res = await fetch(url);
      const data = await res.json().catch(() => ({}));
      if(!res.ok){
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      currentArticles = data.articles || [];
      renderFeed(currentArticles);
      statusLine.textContent = 'LIVE — OXIRGI YANGILANISH: ' + new Date().toLocaleTimeString('uz-UZ',{hour12:false});
    } catch(err){
      console.error(err);
      feedEl.innerHTML = `<div class="error-box">
        XATOLIK YUZ BERDI: ${escapeHtml(err.message)}<br><br>
        Tekshir: 1) Vercel'da GNEWS_KEY environment variable qo'yilganmi? 2) Kunlik limit (100) tugamadimi? 3) "uz" mamlakati uchun local yangilik kam bo'lishi mumkin — global tab'ni sinab ko'r.
      </div>`;
      statusLine.textContent = 'XATOLIK';
    }
  }

  function renderFeed(articles){
    if(!articles.length){
      feedEl.innerHTML = '<div class="placeholder">BU FEED UCHUN YANGILIK TOPILMADI</div>';
      feedCount.textContent = '0 TA YANGILIK';
      return;
    }
    feedCount.textContent = articles.length + ' TA YANGILIK';
    feedEl.innerHTML = articles.map((a, i) => {
      const num = String(i+1).padStart(2,'0');
      const src = a.source && a.source.name ? a.source.name : 'NOMA\'LUM';
      const date = a.publishedAt ? new Date(a.publishedAt).toLocaleString('uz-UZ') : '';
      const desc = a.description ? escapeHtml(a.description) : '';
      return `
        <article class="story" data-idx="${i}">
          <div class="story-index">${num}<span class="src">${escapeHtml(src)}</span></div>
          <div>
            <h2><a href="${a.url}" target="_blank" rel="noopener">${escapeHtml(a.title || 'Sarlavhasiz')}</a></h2>
            <p class="desc">${desc}</p>
            <div class="meta">${date}</div>

            <div class="ai-toolbar">
              <button class="ai-btn" data-action="explain" data-idx="${i}">🇺🇿 Tarjima + Tushuntirish</button>
              <button class="ai-btn" data-action="discuss" data-idx="${i}">💬 Muhokama qilish</button>
            </div>

            <div class="ai-panel" id="ai-panel-${i}">
              <div class="ai-tag"><span>AI TUSHUNTIRISHI</span><span></span></div>
              <div class="ai-body" id="ai-body-${i}"></div>
            </div>

            <div class="chat-panel" id="chat-panel-${i}">
              <div class="chat-log" id="chat-log-${i}"></div>
              <div class="chat-input-row">
                <input type="text" id="chat-input-${i}" placeholder="Bu yangilik haqida savol yoz...">
                <button data-action="send" data-idx="${i}">YUBOR</button>
              </div>
            </div>
          </div>
        </article>`;
    }).join('');

    // event delegation o'rniga to'g'ridan-to'g'ri bog'laymiz — oddiy va tushunarli
    feedEl.querySelectorAll('[data-action="explain"]').forEach(btn => {
      btn.addEventListener('click', () => handleExplain(Number(btn.dataset.idx), btn));
    });
    feedEl.querySelectorAll('[data-action="discuss"]').forEach(btn => {
      btn.addEventListener('click', () => toggleDiscuss(Number(btn.dataset.idx)));
    });
    feedEl.querySelectorAll('[data-action="send"]').forEach(btn => {
      btn.addEventListener('click', () => handleSend(Number(btn.dataset.idx)));
    });
    feedEl.querySelectorAll('[id^="chat-input-"]').forEach(input => {
      input.addEventListener('keydown', (e) => {
        if(e.key === 'Enter'){
          const idx = Number(input.id.replace('chat-input-',''));
          handleSend(idx);
        }
      });
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // =========================================================
  // 3) "TARJIMA + TUSHUNTIRISH" — bitta AI chaqiruv, natija panelga chiqadi
  // =========================================================
  async function handleExplain(idx, btn){
    const a = currentArticles[idx];
    if(!a) return;
    const panel = document.getElementById(`ai-panel-${idx}`);
    const body = document.getElementById(`ai-body-${idx}`);

    btn.disabled = true;
    btn.textContent = '⏳ ISHLANMOQDA...';
    panel.classList.add('show');
    body.textContent = 'AI javob tayyorlayapti...';

    const sys = `Sen tajribali xalqaro yangiliklar sharhlovchisisan. Foydalanuvchiga ingliz/rus tilidagi yangilikni O'ZBEK TILIDA quyidagi tartibda taqdim et:
1) Sarlavha tarjimasi (qalin emas, oddiy matn)
2) 3-5 gapli batafsil tushuntirish: nima bo'ldi, nega muhim, fon (context)
3) Agar tegishli bo'lsa — bu voqea nimaga olib kelishi mumkinligi haqida qisqa fikr
Faqat o'zbek tilida yoz. Sodda, tushunarli, lekin professional uslubda.`;

    const userMsg = `Sarlavha: ${a.title || ''}\nTavsif: ${a.description || ''}\nManba: ${a.source?.name || ''}`;

    try{
      const result = await aiChat([
        { role: 'system', content: sys },
        { role: 'user', content: userMsg }
      ]);
      body.textContent = result || 'AI bo\'sh javob qaytardi.';
      btn.textContent = '🇺🇿 Qayta tarjima qilish';
    }catch(err){
      body.textContent = 'XATOLIK: ' + err.message;
      btn.textContent = '🇺🇿 Tarjima + Tushuntirish';
    }finally{
      btn.disabled = false;
    }
  }

  // =========================================================
  // 4) "MUHOKAMA QILISH" — story bo'yicha erkin chat, tarix saqlanadi
  // =========================================================
  const chatHistories = {}; // idx -> [{role, content}]

  function toggleDiscuss(idx){
    const panel = document.getElementById(`chat-panel-${idx}`);
    panel.classList.toggle('show');
    if(panel.classList.contains('show') && !chatHistories[idx]){
      const a = currentArticles[idx];
      chatHistories[idx] = [
        { role: 'system', content: `Sen yangiliklar bo'yicha muhokama qiladigan bilimdon suhbatdoshsan. Mavzu: "${a.title || ''}". Tavsif: "${a.description || ''}". Foydalanuvchi bilan o'zbek tilida, tabiiy va batafsil suhbatlash. Savollariga chuqur, faktlarga asoslangan javob ber.` }
      ];
    }
  }

  async function handleSend(idx){
    const input = document.getElementById(`chat-input-${idx}`);
    const log = document.getElementById(`chat-log-${idx}`);
    const btn = document.querySelector(`[data-action="send"][data-idx="${idx}"]`);
    const text = input.value.trim();
    if(!text) return;

    if(!chatHistories[idx]) toggleDiscuss(idx);

    appendChatMsg(log, 'user', text);
    chatHistories[idx].push({ role: 'user', content: text });
    input.value = '';
    input.disabled = true;
    btn.disabled = true;

    const thinkingEl = appendChatMsg(log, 'ai', 'AI yozmoqda...');

    try{
      const result = await aiChat(chatHistories[idx]);
      thinkingEl.textContent = result;
      chatHistories[idx].push({ role: 'assistant', content: result });
    }catch(err){
      thinkingEl.textContent = 'XATOLIK: ' + err.message;
    }finally{
      input.disabled = false;
      btn.disabled = false;
      input.focus();
      log.scrollTop = log.scrollHeight;
    }
  }

  function appendChatMsg(log, role, text){
    const div = document.createElement('div');
    div.className = 'chat-msg ' + role;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  // =========================================================
  // 5) AUTO REFRESH + INIT
  // =========================================================
  function scheduleRefresh(){
    if(refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(loadFeed, 30 * 60 * 1000);
  }

  loadFeed();
  scheduleRefresh();
})();
</script>
