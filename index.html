<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIRE // Live Yangiliklar Terminali</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&display=swap');

  :root{
    --paper:#0d0d0c;
    --paper-raised:#161613;
    --ink:#ecebe4;
    --ink-dim:#8a8a7d;
    --wire-red:#c23b2e;
    --wire-amber:#d9a441;
    --wire-green:#5a9b6f;
    --line:#2a2a24;
    --mono: 'JetBrains Mono', monospace;
    --serif: 'Newsreader', serif;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  header{
    border-bottom:3px double var(--line);
    padding:20px 24px 14px;
    position:sticky;
    top:0;
    background:var(--paper);
    z-index:50;
  }

  .masthead-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-bottom:14px;
    flex-wrap:wrap;
    gap:6px;
  }

  #clock{color:var(--wire-amber); font-weight:700;}
  #aiStatus{color:var(--ink-dim);}
  #aiStatus.ok{color:var(--wire-green);}
  #aiStatus.bad{color:var(--wire-red);}
  #dbStatus{color:var(--ink-dim);}
  #dbStatus.ok{color:var(--wire-green);}
  #dbStatus.bad{color:var(--wire-red);}

  .masthead-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }

  h1{
    font-family:var(--mono);
    font-weight:800;
    font-size:clamp(28px,6vw,46px);
    letter-spacing:-0.02em;
    display:flex;
    align-items:center;
    gap:10px;
  }
  h1 span.blink{
    width:10px;height:10px;border-radius:50%;
    background:var(--wire-red);
    display:inline-block;
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(194,59,46,.5);}
    50%{opacity:.4;box-shadow:0 0 0 6px rgba(194,59,46,0);}
  }

  .status-line{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    text-transform:uppercase;
    letter-spacing:0.05em;
  }

  .tabs{
    display:flex;
    gap:0;
    margin-top:16px;
    border:1px solid var(--line);
  }
  .tab-btn{
    flex:1;
    background:transparent;
    border:none;
    color:var(--ink-dim);
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    padding:10px 8px;
    cursor:pointer;
    border-right:1px solid var(--line);
    transition:.15s;
  }
  .tab-btn:last-child{border-right:none;}
  .tab-btn:hover{color:var(--ink); background:var(--paper-raised);}
  .tab-btn.active{
    background:var(--wire-red);
    color:#fff;
    font-weight:700;
  }

  main{
    max-width:900px;
    margin:0 auto;
    padding:24px 20px 80px;
  }

  #feed-meta{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    text-transform:uppercase;
    letter-spacing:.06em;
    margin-bottom:18px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
  }

  .story{
    padding:22px 0;
    border-bottom:1px solid var(--line);
    display:grid;
    grid-template-columns:90px 1fr;
    gap:18px;
  }
  .story:first-of-type{padding-top:0;}

  .story-index{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    padding-top:4px;
  }
  .story-index .src{
    display:block;
    color:var(--wire-amber);
    font-weight:700;
    margin-top:4px;
    text-transform:uppercase;
    font-size:10px;
  }

  .story h2{
    font-family:var(--serif);
    font-weight:600;
    font-size:20px;
    line-height:1.3;
    margin-bottom:8px;
  }
  .story h2 a{color:var(--ink); text-decoration:none;}
  .story h2 a:hover{color:var(--wire-amber);}

  .story p.desc{
    font-size:14.5px;
    line-height:1.55;
    color:#c9c8bd;
    font-style:italic;
  }

  .story .meta{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-dim);
    margin-top:10px;
    text-transform:uppercase;
    letter-spacing:.04em;
  }

  .ai-toolbar{
    display:flex;
    gap:8px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .ai-btn{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-dim);
    padding:6px 10px;
    cursor:pointer;
    transition:.15s;
  }
  .ai-btn:hover{border-color:var(--wire-amber); color:var(--wire-amber);}
  .ai-btn:disabled{opacity:.4; cursor:wait;}

  .ai-panel{
    margin-top:12px;
    border-left:2px solid var(--wire-amber);
    padding:10px 14px;
    background:var(--paper-raised);
    display:none;
  }
  .ai-panel.show{display:block;}
  .ai-panel .ai-tag{
    font-family:var(--mono);
    font-size:9.5px;
    color:var(--wire-amber);
    text-transform:uppercase;
    letter-spacing:.08em;
    margin-bottom:6px;
    display:flex;
    justify-content:space-between;
  }
  .ai-panel .ai-body{
    font-family:var(--serif);
    font-size:14.5px;
    line-height:1.6;
    color:var(--ink);
    white-space:pre-wrap;
  }

  .chat-panel{
    margin-top:10px;
    display:none;
  }
  .chat-panel.show{display:block;}
  .chat-log{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:8px;
    max-height:340px;
    overflow-y:auto;
  }
  .chat-msg{
    font-family:var(--serif);
    font-size:13.5px;
    line-height:1.5;
    padding:8px 10px;
    border-radius:2px;
  }
  .chat-msg.user{
    background:var(--paper-raised);
    color:var(--ink);
    align-self:flex-end;
    max-width:85%;
    border:1px solid var(--line);
  }
  .chat-msg.ai{
    background:transparent;
    color:#c9c8bd;
    border-left:2px solid var(--wire-green);
    padding-left:10px;
    white-space:pre-wrap;
  }
  .chat-input-row{
    display:flex;
    gap:6px;
  }
  .chat-input-row input{
    flex:1;
    background:var(--paper);
    border:1px solid var(--line);
    color:var(--ink);
    padding:8px 10px;
    font-family:var(--serif);
    font-size:13.5px;
  }
  .chat-input-row input:focus{outline:1px solid var(--wire-amber);}
  .chat-input-row button{
    background:var(--wire-amber);
    border:none;
    color:#0d0d0c;
    padding:0 14px;
    font-family:var(--mono);
    font-weight:700;
    font-size:11px;
    cursor:pointer;
    text-transform:uppercase;
  }
  .chat-input-row button:disabled{opacity:.5; cursor:wait;}

  .placeholder{
    font-family:var(--mono);
    text-align:center;
    padding:60px 20px;
    color:var(--ink-dim);
    font-size:13px;
    line-height:1.8;
  }
  .placeholder .cursor{
    display:inline-block;
    width:8px;height:14px;
    background:var(--wire-amber);
    animation:blink 1s step-end infinite;
    vertical-align:middle;
    margin-left:4px;
  }
  @keyframes blink{50%{opacity:0;}}

  .error-box{
    border:1px solid var(--wire-red);
    background:rgba(194,59,46,.08);
    padding:16px;
    font-family:var(--mono);
    font-size:12px;
    color:#e2a29b;
    line-height:1.6;
  }

  footer{
    text-align:center;
    font-family:var(--mono);
    font-size:10px;
    color:var(--ink-dim);
    padding:24px;
    border-top:1px solid var(--line);
    text-transform:uppercase;
    letter-spacing:.08em;
  }

  @media (max-width:600px){
    .story{grid-template-columns:1fr; gap:6px;}
    .story-index{display:flex; gap:8px; align-items:center;}
    .story-index .src{margin-top:0;}
  }
</style>
</head>
<body>

<header>
  <div class="masthead-top">
    <span>ESTABLISHED TODAY // AUTO-REFRESH: 30 MIN</span>
    <span id="dbStatus">DB: TEKSHIRILMOQDA...</span>
    <span id="aiStatus">AI: TEKSHIRILMOQDA...</span>
    <span id="clock">--:--:--</span>
  </div>
  <div class="masthead-title">
    <h1><span class="blink"></span>WIRE</h1>
    <div class="status-line" id="statusLine">TERMINAL IDLE</div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-mode="global">🌍 Global</button>
    <button class="tab-btn" data-mode="local">🇺🇿 O'zbekiston</button>
  </div>
</header>

<main>
  <div id="feed-meta">
    <span id="feedLabel">GLOBAL FEED</span>
    <span id="feedCount">0 TA YANGILIK</span>
  </div>
  <div id="feed">
    <div class="placeholder">YUKLANMOQDA<span class="cursor"></span></div>
  </div>
</main>

<footer>WIRE TERMINAL — GNews (server proxy) + AI (server proxy) + Firestore (arxiv &amp; chat tarixi)</footer>

<!--
  Bratan, o'zgarishlar shu yerda:
  1) AI key'lar butunlay frontend'dan olib tashlandi. Endi /api/ai-chat orqali
     chaqiriladi — key'lar Vercel Environment Variables'da turadi, brauzer
     ularni hech qachon ko'rmaydi.
  2) Firestore ulandi (firebase-init.js, type="module"). Feed har yuklanganda
     article'lar bazaga yoziladi (merge), AI tushuntirish natijasi keshlanadi,
     chat tarixi subcollection'da saqlanadi va sahifa yangilansa ham yo'qolmaydi.
  3) firestore.rules faylini alohida bераман — uni Firebase Console yoki CLI
     orqali deploy qilishing kerak, bu faylning ichida emas.
-->
<script type="module">
import {
  hashUrl,
  upsertArticle,
  getArticleDoc,
  saveExplainResult,
  loadChatHistory,
  appendChatMessage
} from './firebase-init.js';

(function(){
  // =========================================================
  // 0) STATUS HELPERS
  // =========================================================
  function setAiStatus(text, cls){
    const el = document.getElementById('aiStatus');
    el.textContent = 'AI: ' + text;
    el.className = cls || '';
  }
  function setDbStatus(text, cls){
    const el = document.getElementById('dbStatus');
    el.textContent = 'DB: ' + text;
    el.className = cls || '';
  }
  setAiStatus('SERVER PROXY ORQALI', '');
  setDbStatus('FIRESTORE ULANDI', 'ok');

  // =========================================================
  // 1) AI CALL LAYER — endi server-side proxy orqali.
  //    Fallback zanjiri (groq -> openrouter -> gemini) va key round-robin
  //    logikasi /api/ai-chat.js ichiga ko'chdi. Frontend faqat shu endpoint'ga
  //    messages jo'natadi, qaysi provider ishlaganini bilishi shart emas.
  // =========================================================
  async function aiChat(messages){
    setAiStatus('SO\'ROV YUBORILMOQDA...', '');
    try{
      const res = await fetch('/api/ai-chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages })
      });
      const data = await res.json().catch(() => ({}));
      if(!res.ok){
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      setAiStatus((data.provider || 'AI').toUpperCase() + ' — ISHLADI', 'ok');
      return data.result || '';
    }catch(err){
      setAiStatus('XATOLIK', 'bad');
      throw err;
    }
  }

  // =========================================================
  // 2) GNEWS FEED + FIRESTORE ARXIV
  // =========================================================
  const feedEl = document.getElementById('feed');
  const feedLabel = document.getElementById('feedLabel');
  const feedCount = document.getElementById('feedCount');
  const statusLine = document.getElementById('statusLine');
  const tabs = document.querySelectorAll('.tab-btn');

  let currentMode = 'global';
  let refreshTimer = null;
  let currentArticles = []; // hozirgi feed'dagi maqolalar, {..., id} bilan (id = hashUrl natijasi)

  function tickClock(){
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('uz-UZ', {hour12:false});
  }
  tickClock();
  setInterval(tickClock, 1000);

  tabs.forEach(btn => {
    btn.addEventListener('click', () => {
      tabs.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
      feedLabel.textContent = currentMode === 'global' ? 'GLOBAL FEED' : "O'ZBEKISTON FEED";
      loadFeed();
    });
  });

  async function loadFeed(){
    statusLine.textContent = 'YUKLANMOQDA...';
    feedEl.innerHTML = '<div class="placeholder">SO\'ROV YUBORILMOQDA<span class="cursor"></span></div>';

    const url = `/api/gnews?mode=${currentMode}`;

    try{
      const res = await fetch(url);
      const data = await res.json().catch(() => ({}));
      if(!res.ok){
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      const rawArticles = data.articles || [];

      // Har article uchun barqaror ID chiqaramiz (url hash) va Firestore'ga yozamiz.
      // Bu qadam sekin bo'lishi mumkin (SHA-256 + Firestore write har birida) —
      // shuning uchun Promise.all bilan parallel qilamiz.
      currentArticles = await Promise.all(rawArticles.map(async (a) => {
        const id = await hashUrl(a.url || a.title || Math.random().toString());
        // fire-and-forget emas — kutamiz, chunki keyingi qadamda shu id kerak bo'ladi.
        // Xato bo'lsa ham feed ko'rsatishni to'xtatmaymiz (bazaga yozib bo'lmasa ham,
        // foydalanuvchi yangilikni o'qishi kerak).
        try{
          await upsertArticle(id, a, currentMode);
        }catch(e){
          console.warn('Firestore upsert xato:', e.message);
        }
        return { ...a, id };
      }));

      renderFeed(currentArticles);
      statusLine.textContent = 'LIVE — OXIRGI YANGILANISH: ' + new Date().toLocaleTimeString('uz-UZ',{hour12:false});
    } catch(err){
      console.error(err);
      feedEl.innerHTML = `<div class="error-box">
        XATOLIK YUZ BERDI: ${escapeHtml(err.message)}<br><br>
        Tekshir: 1) Vercel'da GNEWS_KEY environment variable qo'yilganmi? 2) Kunlik limit (100) tugamadimi? 3) "uz" mamlakati uchun local yangilik kam bo'lishi mumkin — global tab'ni sinab ko'r.
      </div>`;
      statusLine.textContent = 'XATOLIK';
    }
  }

  function renderFeed(articles){
    if(!articles.length){
      feedEl.innerHTML = '<div class="placeholder">BU FEED UCHUN YANGILIK TOPILMADI</div>';
      feedCount.textContent = '0 TA YANGILIK';
      return;
    }
    feedCount.textContent = articles.length + ' TA YANGILIK';
    feedEl.innerHTML = articles.map((a, i) => {
      const num = String(i+1).padStart(2,'0');
      const src = a.source && a.source.name ? a.source.name : 'NOMA\'LUM';
      const date = a.publishedAt ? new Date(a.publishedAt).toLocaleString('uz-UZ') : '';
      const desc = a.description ? escapeHtml(a.description) : '';
      return `
        <article class="story" data-idx="${i}" data-id="${a.id}">
          <div class="story-index">${num}<span class="src">${escapeHtml(src)}</span></div>
          <div>
            <h2><a href="${a.url}" target="_blank" rel="noopener">${escapeHtml(a.title || 'Sarlavhasiz')}</a></h2>
            <p class="desc">${desc}</p>
            <div class="meta">${date}</div>

            <div class="ai-toolbar">
              <button class="ai-btn" data-action="explain" data-idx="${i}">🇺🇿 Tarjima + Tushuntirish</button>
              <button class="ai-btn" data-action="discuss" data-idx="${i}">💬 Muhokama qilish</button>
            </div>

            <div class="ai-panel" id="ai-panel-${i}">
              <div class="ai-tag"><span>AI TUSHUNTIRISHI</span><span></span></div>
              <div class="ai-body" id="ai-body-${i}"></div>
            </div>

            <div class="chat-panel" id="chat-panel-${i}">
              <div class="chat-log" id="chat-log-${i}"></div>
              <div class="chat-input-row">
                <input type="text" id="chat-input-${i}" placeholder="Bu yangilik haqida savol yoz...">
                <button data-action="send" data-idx="${i}">YUBOR</button>
              </div>
            </div>
          </div>
        </article>`;
    }).join('');

    feedEl.querySelectorAll('[data-action="explain"]').forEach(btn => {
      btn.addEventListener('click', () => handleExplain(Number(btn.dataset.idx), btn));
    });
    feedEl.querySelectorAll('[data-action="discuss"]').forEach(btn => {
      btn.addEventListener('click', () => toggleDiscuss(Number(btn.dataset.idx)));
    });
    feedEl.querySelectorAll('[data-action="send"]').forEach(btn => {
      btn.addEventListener('click', () => handleSend(Number(btn.dataset.idx)));
    });
    feedEl.querySelectorAll('[id^="chat-input-"]').forEach(input => {
      input.addEventListener('keydown', (e) => {
        if(e.key === 'Enter'){
          const idx = Number(input.id.replace('chat-input-',''));
          handleSend(idx);
        }
      });
    });

    // Sahifa qayta render bo'lganda — avval shu article uchun keshlangan
    // AI tushuntirish yoki chat tarixi bor-yo'qligini Firestore'dan tekshiramiz.
    articles.forEach((a, i) => restoreCachedState(a.id, i));
  }

  // Bazadagi eski explainResult va chat tarixini panelga qayta chiqaramiz,
  // shunda foydalanuvchi bir marta AI so'ragan narsani ikkinchi marta pul
  // to'lab (token sarflab) so'ramaydi.
  async function restoreCachedState(articleId, idx){
    try{
      const doc = await getArticleDoc(articleId);
      if(doc && doc.explainResult){
        const panel = document.getElementById(`ai-panel-${idx}`);
        const body = document.getElementById(`ai-body-${idx}`);
        const btn = document.querySelector(`[data-action="explain"][data-idx="${idx}"]`);
        if(panel && body){
          body.textContent = doc.explainResult;
          panel.classList.add('show');
          if(btn) btn.textContent = '🇺🇿 Qayta tarjima qilish';
        }
      }
    }catch(e){
      console.warn('Firestore restore xato:', e.message);
    }
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // =========================================================
  // 3) "TARJIMA + TUSHUNTIRISH" — natija Firestore'ga keshlanadi
  // =========================================================
  async function handleExplain(idx, btn){
    const a = currentArticles[idx];
    if(!a) return;
    const panel = document.getElementById(`ai-panel-${idx}`);
    const body = document.getElementById(`ai-body-${idx}`);

    btn.disabled = true;
    btn.textContent = '⏳ ISHLANMOQDA...';
    panel.classList.add('show');
    body.textContent = 'AI javob tayyorlayapti...';

    const sys = `Sen tajribali xalqaro yangiliklar sharhlovchisisan. Foydalanuvchiga ingliz/rus tilidagi yangilikni O'ZBEK TILIDA quyidagi tartibda taqdim et:
1) Sarlavha tarjimasi (qalin emas, oddiy matn)
2) 3-5 gapli batafsil tushuntirish: nima bo'ldi, nega muhim, fon (context)
3) Agar tegishli bo'lsa — bu voqea nimaga olib kelishi mumkinligi haqida qisqa fikr
Faqat o'zbek tilida yoz. Sodda, tushunarli, lekin professional uslubda.`;

    const userMsg = `Sarlavha: ${a.title || ''}\nTavsif: ${a.description || ''}\nManba: ${a.source?.name || ''}`;

    try{
      const result = await aiChat([
        { role: 'system', content: sys },
        { role: 'user', content: userMsg }
      ]);
      body.textContent = result || 'AI bo\'sh javob qaytardi.';
      btn.textContent = '🇺🇿 Qayta tarjima qilish';

      // Natijani Firestore'ga yozamiz — keyingi safar shu articlega qaytilsa
      // AI'ni qayta chaqirmasdan shu yerdan o'qiymiz.
      try{ await saveExplainResult(a.id, result || ''); }
      catch(e){ console.warn('explainResult saqlanmadi:', e.message); }

    }catch(err){
      body.textContent = 'XATOLIK: ' + err.message;
      btn.textContent = '🇺🇿 Tarjima + Tushuntirish';
    }finally{
      btn.disabled = false;
    }
  }

  // =========================================================
  // 4) "MUHOKAMA QILISH" — chat tarixi endi Firestore subcollection'da.
  //    RAM'dagi chatHistories — shu sessiya davomidagi ishchi nusxa,
  //    lekin har xabar Firestore'ga ham yoziladi, sahifa yangilansa yo'qolmaydi.
  // =========================================================
  const chatHistories = {}; // idx -> [{role, content}]  (system prompt shu yerda saqlanadi, DB'ga yozilmaydi)
  const chatLoaded = {};    // idx -> bool, DB'dan tarix bir marta yuklandimi

  async function toggleDiscuss(idx){
    const panel = document.getElementById(`chat-panel-${idx}`);
    const wasHidden = !panel.classList.contains('show');
    panel.classList.toggle('show');
    if(!wasHidden) return; // yopilyapti — qayta yuklash shart emas

    const a = currentArticles[idx];
    if(!chatHistories[idx]){
      chatHistories[idx] = [
        { role: 'system', content: `Sen yangiliklar bo'yicha muhokama qiladigan bilimdon suhbatdoshsan. Mavzu: "${a.title || ''}". Tavsif: "${a.description || ''}". Foydalanuvchi bilan o'zbek tilida, tabiiy va batafsil suhbatlash. Savollariga chuqur, faktlarga asoslangan javob ber.` }
      ];
    }

    if(!chatLoaded[idx]){
      chatLoaded[idx] = true;
      const log = document.getElementById(`chat-log-${idx}`);
      try{
        const history = await loadChatHistory(a.id); // [{role, content, createdAt}]
        history.forEach(msg => {
          chatHistories[idx].push({ role: msg.role, content: msg.content });
          appendChatMsg(log, msg.role === 'user' ? 'user' : 'ai', msg.content);
        });
      }catch(e){
        console.warn('Chat tarixi yuklanmadi:', e.message);
      }
    }
  }

  async function handleSend(idx){
    const input = document.getElementById(`chat-input-${idx}`);
    const log = document.getElementById(`chat-log-${idx}`);
    const btn = document.querySelector(`[data-action="send"][data-idx="${idx}"]`);
    const text = input.value.trim();
    if(!text) return;

    const a = currentArticles[idx];
    if(!chatHistories[idx]) await toggleDiscuss(idx);

    appendChatMsg(log, 'user', text);
    chatHistories[idx].push({ role: 'user', content: text });
    input.value = '';
    input.disabled = true;
    btn.disabled = true;

    // Firestore'ga yozamiz — kutmasdan (UI bloklanmasin), lekin xatoni log qilamiz.
    appendChatMessage(a.id, 'user', text).catch(e => console.warn('chat write xato:', e.message));

    const thinkingEl = appendChatMsg(log, 'ai', 'AI yozmoqda...');

    try{
      const result = await aiChat(chatHistories[idx]);
      thinkingEl.textContent = result;
      chatHistories[idx].push({ role: 'assistant', content: result });
      appendChatMessage(a.id, 'assistant', result).catch(e => console.warn('chat write xato:', e.message));
    }catch(err){
      thinkingEl.textContent = 'XATOLIK: ' + err.message;
    }finally{
      input.disabled = false;
      btn.disabled = false;
      input.focus();
      log.scrollTop = log.scrollHeight;
    }
  }

  function appendChatMsg(log, role, text){
    const div = document.createElement('div');
    div.className = 'chat-msg ' + role;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  // =========================================================
  // 5) AUTO REFRESH + INIT
  // =========================================================
  function scheduleRefresh(){
    if(refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(loadFeed, 30 * 60 * 1000);
  }

  loadFeed();
  scheduleRefresh();
})();
</script>
