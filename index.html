<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FMN — ForMrNews</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<script>
try{
  var t = localStorage.getItem('fmn-theme');
  if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
}catch(e){}
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&display=swap');

  /* Header va control-bar balandligi — JS orqali (ResizeObserver) real vaqtda
     o'lchanadi va shu yerga yoziladi. Bu yerdagi qiymatlar faqat JS ishlab
     ulgurmagunicha ko'rinadigan boshlang'ich taxmin (fallback). */
  :root{
    --header-h:56px;
    --control-h:33px;
  }

  /* Dark va Light to'liq ajratilgan — har biri o'z tokenlari */
  :root, html[data-theme="dark"]{
    --paper:#16140f;
    --paper-raised:#1f1c16;
    --ink:#e8e2d6;
    --ink-dim:#a39b8c;
    --wire-red:#c45a4c;
    --wire-amber:#e08a63;
    --wire-green:#d97757;
    --line:#2f2b24;
    --btn:#1f1c16;
    --btn-hover:#2a261f;
    --control-bg:transparent;
    --control-bg-hover:transparent;
    --control-bg-on:var(--wire-amber);
    --control-ink:var(--ink-dim);
    --control-ink-hover:var(--wire-amber);
    --control-ink-on:#0d0d0c;
    --control-border:var(--line);
    --control-border-on:var(--wire-amber);
    --thumb-bg:var(--paper-raised);
    --thumb-border:color-mix(in srgb, var(--wire-red) 55%, var(--line));
    --desc:var(--ink-dim);
    --on-accent:#0d0d0c;
    --on-strong:#ffffff;
    --radius:14px;
    --radius-sm:10px;
    --shadow:0 10px 30px rgba(0,0,0,.28);
    --mono: 'JetBrains Mono', monospace;
    --serif: 'Newsreader', serif;
    color-scheme: dark;
  }
  html[data-theme="light"]{
    --paper:#f3eadc;
    --paper-raised:#f8f2e6;
    --ink:#2a241c;
    --ink-dim:#5e574b;
    --wire-red:#b54a3d;
    --wire-amber:#b5563a;
    --wire-green:#c15f3c;
    --line:#e0d5c3;
    --btn:#f8f2e6;
    --btn-hover:#efe6d4;
    --control-bg:#ffffff;
    --control-bg-hover:#ffffff;
    --control-bg-on:#ffffff;
    --control-ink:var(--ink-dim);
    --control-ink-hover:var(--wire-amber);
    --control-ink-on:var(--wire-amber);
    --control-border:var(--line);
    --control-border-on:var(--wire-amber);
    --thumb-bg:#ffffff;
    --thumb-border:var(--line);
    --desc:#2f2a22;
    --on-accent:#0d0d0c;
    --on-strong:#ffffff;
    --shadow:0 10px 28px rgba(40,32,16,.08);
    color-scheme: light;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html{
    scrollbar-width:thin;               /* Firefox — tor va neytral */
    scrollbar-color:var(--line) var(--paper);
    scrollbar-gutter:stable;            /* scrollbar paydo bo'lganda silkinish yo'q */
    overflow-y:scroll;                  /* scrollbar joyi doim band */
    background:var(--paper);
    transition:background-color .35s ease, color .35s ease;
  }
  body{
    background:var(--paper);
    color:var(--ink);
    overflow-x:hidden;
    font-family:var(--serif);
    font-size:17px;
    line-height:1.65;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    transition:background-color .35s ease, color .35s ease;
  }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation:none !important;
      transition:none !important;
    }
  }

  /* Butun sayt bo'ylab bitta xira, tor, dark-theme scrollbar —
     brauzerning default oq/qalin scrollbari umuman chiqmasin. */
  ::-webkit-scrollbar{
    width:8px;
    height:8px;
  }
  ::-webkit-scrollbar-track{
    background:var(--paper);
  }
  ::-webkit-scrollbar-thumb{
    background:var(--line);
    border-radius:4px;
  }
  ::-webkit-scrollbar-thumb:hover{
    background:var(--ink-dim);
  }

  header{
    padding:12px 32px;
    position:fixed;
    top:0;
    left:0;
    right:0;
    width:100%;
    background:var(--paper);
    z-index:100;
    /* blur + solid — scroll paytida ostidagi matn ko'rinmasin */
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    background:color-mix(in srgb, var(--paper) 92%, transparent);
  }

  .masthead-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:nowrap;
    gap:10px;
    min-width:0;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
    cursor:pointer;
    user-select:none;
    border-radius:10px;
    padding:4px 6px 4px 2px;
    transition:opacity .2s ease, background-color .2s ease;
  }
  .brand:hover{ opacity:.85; }
  .brand:active{ opacity:.7; }
  .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--wire-red);
    display:inline-block;
    animation:pulse 1.6s infinite;
    flex-shrink:0;
  }

  nav.top-nav{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:nowrap;
    min-width:0;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  nav.top-nav::-webkit-scrollbar{ display:none; }
  nav.top-nav .hdr-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:0;
    background:var(--btn);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:var(--mono);
    font-size:12px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:10px;
    width:42px;
    height:42px;
    cursor:pointer;
    border-radius:var(--radius-sm);
    text-decoration:none;
    transition:background-color .28s ease, border-color .28s ease, color .28s ease, transform .28s ease, box-shadow .28s ease;
    white-space:nowrap;
    flex-shrink:0;
  }
  nav.top-nav .hdr-btn:hover{
    background:var(--btn-hover);
    transform:translateY(-1px);
    box-shadow:var(--shadow);
  }
  nav.top-nav .hdr-btn.active{
    background:var(--wire-red);
    border-color:var(--wire-red);
    color:var(--on-strong);
  }
  nav.top-nav .hdr-btn.loading{
    opacity:.6;
    cursor:wait;
  }
  /* Icon-only: yozuvlar yashirin, tooltip (title) orqali tushuntiriladi */
  nav.top-nav .hdr-label{
    display:none;
  }
  nav.top-nav .hdr-ico{
    width:18px;
    height:18px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  nav.top-nav .hdr-ico svg{
    width:18px;
    height:18px;
    display:block;
  }
  html[data-theme="dark"] .icon-sun{display:none;}
  html[data-theme="light"] .icon-moon{display:none;}
  .ai-btn svg{width:14px;height:14px;display:block;flex-shrink:0;}

  /* TARIX va SAVED: sidebar ko'rinmas, lekin joyi saqlanadi —
     feed kengayib "cho'zilmasin" (layout sakramasini) */
  body.mode-history aside#trending,
  body.mode-saved aside#trending{
    visibility:hidden;
    pointer-events:none;
  }

  .masthead-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-bottom:14px;
    flex-wrap:wrap;
    gap:6px;
  }

  #clock{color:var(--wire-amber); font-weight:700;}
  #aiStatus{color:var(--ink-dim);}
  #aiStatus.ok{color:var(--wire-green);}
  #aiStatus.bad{color:var(--wire-red);}
  #dbStatus{color:var(--ink-dim);}
  #dbStatus.ok{color:var(--wire-green);}
  #dbStatus.bad{color:var(--wire-red);}

  .masthead-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }

  h1{
    font-family:var(--mono);
    font-weight:800;
    font-size:22px;
    letter-spacing:-0.01em;
    display:flex;
    align-items:center;
    gap:10px;
  }
  h1 span.blink{
    width:11px;
    height:11px;
    border-radius:50%;
    background:var(--wire-red);
    display:inline-block;
    flex-shrink:0;
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1; box-shadow:0 0 0 0 color-mix(in srgb, var(--wire-red) 55%, transparent);}
    50%{opacity:.55; box-shadow:0 0 0 8px transparent;}
  }

  .status-line{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    text-transform:uppercase;
    letter-spacing:0.05em;
  }

  .translate-btn.active{
    background:var(--wire-green);
    border-color:var(--wire-green);
    color:var(--on-accent);
  }
  .translate-btn.loading svg{
    animation:spin 1s linear infinite;
  }
  @keyframes spin{
    100%{transform:rotate(360deg);}
  }
  .desc.translated, h2.translated a{
    color: var(--wire-green);
  }

  /* Bratan, pastki "control-bar" — soat, DB/AI status, tarjima tugmasi va
     tab'lar shu qatorga tushdi. Asosiy header endi toza gazeta-masthead,
     texnik status/kontrol qismi esa alohida ingichka chiziq ostida. */
  .control-bar{
    position:fixed;
    top:var(--header-h);
    left:0;
    right:0;
    z-index:99;
    width:100%;
    max-width:none;
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:6px 32px;
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    letter-spacing:.04em;
    background:color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  .control-bar .dev-status{ display:none; }
  .control-bar .control-left{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    max-width:1160px;
    width:100%;
    justify-content:flex-start;
  }
  .control-bar .control-right{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }

  .tab-btn.active{
    background:var(--wire-red);
    border-color:var(--wire-red);
    color:var(--on-strong);
    font-weight:700;
  }

  /* Bratishka, ASOSIY O'ZGARISH shu yerda: main endi 2-column grid —
     chapda feed (hero + story ro'yxati), o'ngda "ENG KO'P O'QILGANLAR"
     sidebar. 900px ustunli, mono-column "terminal" layout screenshot'dagi
     klassik gazeta-uslub 2-column'ga aylandi. */
  main{
    max-width:1160px;
    margin:0 auto;
    /* header + control-bar haqiqiy balandligi (JS orqali o'lchanadi) + bo'shliq */
    padding:calc(var(--header-h) + var(--control-h) + 20px) 32px 80px;
    display:grid;
    grid-template-columns:1fr 300px;
    gap:48px;
    align-items:start;
  }

  #feed-col{ min-width:0; }

  #feed-meta{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    text-transform:uppercase;
    letter-spacing:.06em;
    margin-bottom:18px;
    padding-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }

  /* HERO — birinchi story (index 0) katta blok bo'lib chiqadi, screenshot'dagi
     rasm+katta sarlavha kabi. GNews rasm bermasa ham joy egallab turadi,
     kelajakda <img> qo'shsang shu joyga tushadi. */
  .story{
    padding:14px;
    margin-bottom:16px;
    border:1px solid var(--line);
    border-radius:22px;
    background:var(--paper-raised);
    display:grid;
    grid-template-columns:148px 1fr;
    grid-template-areas:
      "pic body"
      "more more";
    gap:12px 16px;
    align-items:start;
    transition:box-shadow .28s ease, border-color .28s ease;
  }
  .story:hover{ box-shadow:var(--shadow); }
  .story-top{
    display:contents;
  }
  .story-thumb{
    grid-area:pic;
    width:148px;
    height:148px;
    min-height:148px;
    aspect-ratio:1;
    background:var(--thumb-bg);
    border:2px solid var(--thumb-border);
    border-radius:18px;
    overflow:hidden;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }
  .story-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    position:absolute;
    inset:0;
    transition:transform .45s ease;
  }
  .story:hover .story-thumb img{ transform:scale(1.015); }
  .story-body{
    grid-area:body;
    min-width:0;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:0;
  }
  .card-more{
    align-self:flex-end;
    margin-top:auto;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:0;
    background:var(--control-bg);
    border:1px solid var(--control-border);
    color:var(--control-ink);
    font-family:var(--serif);
    font-size:16px;
    cursor:pointer;
    padding:0;
    width:34px;
    height:34px;
    border-radius:10px;
    transition:color .28s ease, border-color .28s ease, background-color .28s ease, transform .28s ease;
  }
  .card-more:hover{
    background:var(--control-bg-hover);
    color:var(--control-ink-hover);
    border-color:var(--control-border-on);
  }
  .story.open .card-more{
    background:var(--control-bg-on);
    color:var(--control-ink-on);
    border-color:var(--control-border-on);
  }
  .card-actions{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:10px;
    margin-top:auto;
  }
  .later-btn{
    background:var(--control-bg);
    border:1px solid var(--control-border);
    color:var(--control-ink);
    width:34px;
    height:34px;
    border-radius:10px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background-color .25s ease, border-color .25s ease, color .25s ease, transform .2s ease;
  }
  .later-btn svg{ width:16px; height:16px; fill:none; stroke:currentColor; transition:fill .2s ease; }
  .later-btn:hover{
    background:var(--control-bg-hover);
    border-color:var(--control-border-on);
    color:var(--control-ink-hover);
  }
  /* Saqlangan — theme tokenlari orqali (dark: orange fill, light: oq + orange icon) */
  .later-btn.on{
    background:var(--control-bg-on);
    border-color:var(--control-border-on);
    color:var(--control-ink-on);
  }
  .later-btn.on svg{
    fill:currentColor;
    stroke:currentColor;
  }
  .later-btn.on:hover{
    background:var(--control-bg-on);
    border-color:var(--control-border-on);
    color:var(--control-ink-on);
  }
  .card-more svg{ width:16px; height:16px; transition:transform .35s ease; }
  .story.open .card-more svg{ transform:rotate(180deg); }
  /* Ochilish/yopilish — transition YO'Q (animatsiya silkinish berardi) */
  .story-more{
    grid-area:more;
    margin-top:0;
    width:100%;
    display:none;
  }
  .story.open .story-more{
    display:block;
    margin-top:4px;
  }
  .story-more-clip{
    min-height:0;
  }
  .story-more-box{
    border:1px solid var(--line);
    border-radius:18px;
    padding:18px 20px 14px;
    background:var(--paper);
    max-width:44rem;
  }
  .ask-row{
    display:flex;
    gap:8px;
    margin-top:12px;
    align-items:center;
  }
  .ask-row input{
    flex:1;
    background:var(--paper-raised);
    border:1px solid var(--line);
    color:var(--ink);
    padding:10px 14px;
    font-family:var(--serif);
    font-size:14px;
    border-radius:16px;
  }
  .ask-row input:focus{ outline:none; border-color:var(--wire-amber); }
  .ask-row button{
    width:42px;
    height:42px;
    border:none;
    border-radius:14px;
    background:var(--wire-amber);
    color:#fff;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    box-shadow:0 2px 8px color-mix(in srgb, var(--wire-amber) 35%, transparent);
  }
  .ask-row button:hover{
    filter:brightness(1.08);
  }
  .ask-row button svg{ width:18px; height:18px; stroke:#fff; }
  html[data-theme="light"] .ask-row button{
    background:#c45a2a;
    color:#fff;
    box-shadow:0 2px 10px rgba(196,90,42,.28);
  }
  html[data-theme="light"] .ask-row button svg{ stroke:#fff; }
  .story.hero{
    padding:16px;
    grid-template-columns:1fr;
    grid-template-areas:
      "pic"
      "body"
      "more";
    gap:14px;
    margin-bottom:22px;
  }
  .story.hero .story-thumb{
    width:100%;
    height:auto;
    min-height:200px;
    max-height:320px;
    aspect-ratio:16/9;
    border-radius:20px;
  }
  .story.hero .story-thumb img{
    object-fit:cover;
    max-height:320px;
  }
  .story.hero .story-index{
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:8px;
  }
  .story.hero h2{
    font-size:clamp(26px, 3.2vw, 34px);
    line-height:1.28;
  }
  .story.hero p.desc{ font-size:18px; line-height:1.7; }
  #feed-col > .story:last-of-type{ border-bottom:none; }

  .story-index{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    padding-top:4px;
  }
  .story-index .src{
    display:block;
    color:var(--wire-amber);
    font-weight:700;
    margin-top:4px;
    text-transform:uppercase;
    font-size:10px;
  }

  .story h2{
    font-family:var(--serif);
    font-weight:600;
    font-size:22px;
    line-height:1.35;
    letter-spacing:-0.01em;
    margin-bottom:8px;
    text-wrap:pretty;
  }
  .story h2 a{color:var(--ink); text-decoration:none;}
  .story h2 a:hover{color:var(--wire-amber);}

  /* O'qilgan story'lar xiralashadi, LEKIN "BUGUNGI ENG MASHHUR" (hero)
     hech qachon xiralashmaydi — doimo tiniq qoladi. */
  .story.read:not(.hero){ opacity:.58; }
  .story.read:not(.hero):hover, .story.read:not(.hero).open{ opacity:1; }
  .story.hero, .story.hero.read, .story.hero.read:hover, .story.hero.read.open{
    opacity:1;
  }
  .story p.desc{
    font-size:16.5px;
    line-height:1.7;
    color:var(--ink);
    font-style:normal;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
    max-width:42rem;
  }
  .story.open p.desc{
    -webkit-line-clamp:unset;
    overflow:visible;
  }
  .story p.desc{ color:var(--desc); }

  /* SIDEBAR — doim sticky, fixed header+control ostida */
  aside#trending{
    position:sticky !important;
    top:calc(var(--header-h) + var(--control-h) + 12px);
    z-index:20;
    align-self:start;
    max-height:calc(100vh - var(--header-h) - var(--control-h) - 24px);
    overflow-y:auto;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
  }
  aside#trending h3{
    font-family:var(--mono);
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--wire-red);
    padding-bottom:10px;
    margin-bottom:14px;
  }
  #trending-list{
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  #trending-list li{
    display:flex;
    gap:10px;
    align-items:baseline;
  }
  #trending-list .t-num{
    font-family:var(--mono);
    font-weight:800;
    font-size:13px;
    color:var(--ink-dim);
    flex-shrink:0;
  }
  #trending-list a{
    color:var(--ink);
    text-decoration:none;
    font-size:14px;
    line-height:1.4;
    font-family:var(--serif);
    font-weight:500;
  }
  #trending-list a:hover{ color:var(--wire-amber); }
  #trending-list .t-empty{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    list-style:none;
  }

  .story .meta{

    min-height:1.75em;

  .chat-msg:focus, .chat-msg:focus-visible{
    outline:none !important;

  /* So'zma-so'z smooth paydo bo'lish — typewriter emas.
     Muhim: animation FAQAT JS orqali beriladi (har so'z o'z vaqtida).

  .word-reveal{
    display:block;
  }
  .word-reveal .wr-word{

  /* Markdown render qilingan matn uchun uslub — h2/h3, bold, ro'yxatlar

     orqali deploy qilishing kerak, bu faylning ichida emas.
-->
<script type="module">
import {

} from './firebase-init.js';

(function(){
  // =========================================================
  // -1) HEADER/CONTROL-BAR HAQIQIY BALANDLIGINI O'LCHASH
  //     Bratan, MUHIM: oldin --header-h/--control-h qattiq raqamlar edi

  //     balandlik farq qilardi, natijada soat headr ostiga kirib ketardi
  //     yoki sidebar noto'g'ri joyda "yopishib qolardi". Endi
  //     ResizeObserver haqiqiy balandlikni kuzatib, CSS o'zgaruvchisiga
  //     doimo to'g'ri qiymatni yozib turadi — ekran o'lchami, shrift
  //     yuklanishi yoki kontent o'zgarishidan qat'i nazar.

  function syncHeaderHeights(){
    const header = document.querySelector('header');
    const controlBar = document.querySelector('.control-bar');
    if(header){
      document.documentElement.style.setProperty('--header-h', header.offsetHeight + 'px');
    }
    if(controlBar){
      document.documentElement.style.setProperty('--control-h', controlBar.offsetHeight + 'px');
    }
  }
  syncHeaderHeights();
  window.addEventListener('load', syncHeaderHeights);
  window.addEventListener('resize', syncHeaderHeights);
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(syncHeaderHeights).catch(() => {});
  }
  if(window.ResizeObserver){
    const roHeader = document.querySelector('header');
    const roControl = document.querySelector('.control-bar');
    const ro = new ResizeObserver(() => syncHeaderHeights());
    if(roHeader) ro.observe(roHeader);
    if(roControl) ro.observe(roControl);
  }

  // =========================================================
  // 0) MARKDOWN RENDER — AI/tarjima matnini xavfsiz HTML'ga aylantiradi.
  //    marked.js matnni parse qiladi, DOMPurify natijani tozalaydi (XSS'dan
  //    himoya — AI matni to'g'ridan-to'g'ri innerHTML'ga tushadi, shuning
  //    uchun sanitize qilmasdan qo'yib bo'lmaydi).
  //    Agar CDN yuklanmasa (tarmoq xato) — xom matnga fallback qilamiz,
  //    ilova butunlay to'xtab qolmasligi kerak.
  // =========================================================
  function renderMd(el, text){
    const safeText = text || '';
    if(window.marked && window.DOMPurify){
      const html = DOMPurify.sanitize(marked.parse(safeText));
      el.innerHTML = html;
    }else{
      el.textContent = safeText; // fallback — marked/DOMPurify yuklanmagan
    }
  }

  // Sahifa scrollini qotirish — more/AI/chat paytida layout sakrashini oldini oladi.
  // Foydalanuvchi o'zi scroll qilsa (wheel/touch/keyboard) pin darhol bo'shatiladi —
  // shunda AI javob chiqayotganda scroll qilganda sahifa titramaydi.
  let _pinY = null;
  let _pinUntil = 0;
  let _pinRaf = 0;
  let _userScrolling = false;
  let _userScrollTimer = 0;
  function getScrollY(){
    return window.scrollY || document.documentElement.scrollTop || window.pageYOffset || 0;
  }
  function releasePin(){
    _pinY = null;
    _pinUntil = 0;
    if(_pinRaf){
      cancelAnimationFrame(_pinRaf);
      _pinRaf = 0;
    }
  }
  function markUserScroll(){
    _userScrolling = true;
    releasePin();
    clearTimeout(_userScrollTimer);
    _userScrollTimer = setTimeout(() => { _userScrolling = false; }, 180);
  }
  // Foydalanuvchi scroll ni aniqlash — pin bilan kurashmaslik uchun
  window.addEventListener('wheel', markUserScroll, { passive: true, capture: true });
  window.addEventListener('touchmove', markUserScroll, { passive: true, capture: true });
  window.addEventListener('keydown', (e) => {
    // Space, PageUp/Down, Arrow keys, Home/End
    if([32, 33, 34, 35, 36, 38, 40].includes(e.keyCode)) markUserScroll();
  }, { passive: true, capture: true });

  function pinScroll(ms, forceY){
    // Foydalanuvchi hozir scroll qilayotgan bo'lsa — pin qo'ymaymiz
    if(_userScrolling) return;
    const now = Date.now();
    // Agar allaqachon pin aktiv bo'lsa — Y ni qayta yozmaymiz (silkinish oldini oladi)
    if(forceY != null){
      _pinY = forceY;
    }else if(_pinY == null || now > _pinUntil){
      _pinY = getScrollY();
    }
    _pinUntil = now + (ms == null ? 900 : ms);
    const apply = () => {
      if(_pinY == null || _userScrolling) return;
      const y = getScrollY();
      if(Math.abs(y - _pinY) > 0.5){
        try{ window.scrollTo({ top: _pinY, left: 0, behavior: 'instant' }); }
        catch(_){ window.scrollTo(0, _pinY); }
      }
    };
    apply();
    const tick = () => {
      if(Date.now() > _pinUntil || _userScrolling){
        _pinRaf = 0;
        if(_userScrolling) _pinY = null;
        else if(Date.now() > _pinUntil) _pinY = null;
        return;
      }
      apply();
      _pinRaf = requestAnimationFrame(tick);
    };
    if(!_pinRaf) _pinRaf = requestAnimationFrame(tick);
  }

  // Bratan, sidebar/"oxirgi ochilganlar"dan bosilganda story'ga smooth scroll
  // qilish uchun. pinScroll eski joyga "tortib" qaytarmasligi kerak — shuning
  // uchun _userScrolling flagini vaqtincha o'zimiz true qilib qo'yamiz, bu esa
  // pinScroll'ning HAR QANDAY chaqiruvini (toggleCardMore/handleExplain ichida
  // ham) shu vaqt oralig'ida no-op qiladi (yuqoridagi "if(_userScrolling) return").
  function scrollToStory(target){
    if(!target) return;
    releasePin();
    _userScrolling = true;
    clearTimeout(_userScrollTimer);
    const cs = getComputedStyle(document.documentElement);
    const headerH = parseFloat(cs.getPropertyValue('--header-h')) || 56;
    const controlH = parseFloat(cs.getPropertyValue('--control-h')) || 33;
    const offset = headerH + controlH + 16;
    const top = Math.max(0, target.getBoundingClientRect().top + getScrollY() - offset);
    try{ window.scrollTo({ top, left: 0, behavior: 'smooth' }); }
    catch(_){ window.scrollTo(0, top); }
    // Smooth scroll animatsiyasi tugaguncha (~1s) pinScroll'ga tegmaymiz,
    // shundan keyin himoya odatdagidek davom etadi (AI javob yuklanganda va h.k.)
    _userScrollTimer = setTimeout(() => { _userScrolling = false; }, 1000);
  }
  try{ if('scrollRestoration' in history) history.scrollRestoration = 'manual'; }catch(_){}

  // Konteyner balandligini elastik (smooth) o'zgartirish uchun yordamchi.
  // Matn so'z-baso'z QO'SHILGANDA konteyner balandligi ham shu bilan birga
  // pastga qarab silliq o'sib boradi — oldindan to'liq balandlik "sakrab"
  // chiqmaydi, chunki DOM'ga matn oldindan (invisible holda) qo'yilmaydi,
  // faqat haqiqatan ko'rinadigan qismi kadr-baqadr qo'shiladi.
  function findHeightBox(el){
    // .ai-body/.chat-msg o'zi emas, uning "story-more-box" yoki "chat-log"
    // konteyneri kengayishi kerak — lekin ko'pincha o'zi ham yetarli, chunki
    // parentlar allaqachon avtomatik height'ga ega. Shu sabab elning o'zini
    // animatsiya qilamiz — bu yetarli va boshqa elementlarga ta'sir qilmaydi.
    return el;
  }

  // AI javobi: matn KADR-BAQADR DOM'ga qo'shiladi (oldindan to'liq matn
  // yashirin holda qo'yilmaydi) — shu sabab konteyner balandligi ham matn
  // bilan birga tabiiy ravishda, elastik o'sib boradi.
  async function revealWordsSmooth(el, text, opts = {}){
    pinScroll(1500);
    const safe = (text || '').toString();
    const asMd = !!opts.markdown;
    // Sekinroq — har so'z aniq ko'rinsin
    const delay = opts.delay != null ? opts.delay : 42;

    // Balandlik o'tishi smooth bo'lishi uchun transition qo'yamiz
    const box = findHeightBox(el);
    box.style.transition = 'min-height .18s ease';
    box.style.overflow = 'hidden';

    if(!safe.trim()){
      if(asMd) renderMd(el, safe);
      else el.textContent = safe;
      box.style.overflow = '';
      box.style.transition = '';
      return;
    }

    el.classList.remove('fade-in');
    el.style.opacity = '1';
    el.style.animation = 'none';
    el.innerHTML = '';
    el.classList.add('word-reveal');

    const parts = safe.split(/(\s+)/).filter(Boolean);
    let currentH = el.getBoundingClientRect().height;
    box.style.minHeight = currentH + 'px';

    for(let i = 0; i < parts.length; i++){
      const p = parts[i];
      if(/^\s+$/.test(p)){
        if(p.includes('\n')) el.appendChild(document.createElement('br'));
        else el.appendChild(document.createTextNode(p));
        continue;
      }

      const span = document.createElement('span');
      span.className = 'wr-word';
      span.textContent = p;
      span.style.opacity = '0';
      span.style.display = 'inline';
      el.appendChild(span);

      // Konteyner qanchalik o'sishi kerakligini o'lchaymiz va min-height ni
      // shunga moslaymiz — CSS transition qolganini elastik silliqlaydi.
      const newH = el.getBoundingClientRect().height;
      if(newH > currentH){
        currentH = newH;
        box.style.minHeight = currentH + 'px';
      }

      void span.offsetWidth; // reflow — animatsiya qayta ishlashi uchun
      span.style.animation = 'wordIn .32s ease forwards';

      if(i % 5 === 0) pinScroll(350);
      await new Promise(r => setTimeout(r, delay));
    }

    el.classList.remove('word-reveal');
    if(asMd){
      renderMd(el, safe);
    }
    // Yakunda min-height'ni bo'shatamiz — tabiiy oqim davom etadi
    requestAnimationFrame(() => {
      box.style.minHeight = '';
      box.style.overflow = '';
      box.style.transition = '';
    });
    pinScroll(200);
  }

  // O'zbekiston vaqti (Asia/Tashkent, UTC+5).
  function uzNow(){
    const parts = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Tashkent',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', hour12: false
    }).formatToParts(new Date());
    const g = (t) => parts.find(p => p.type === t).value;
    return {
      dateKey: `${g('year')}-${g('month')}-${g('day')}`,
      hour: Number(g('hour'))
    };
  }

  function todayKey(){
    return uzNow().dateKey;
  }

  function yesterdayKey(dateKey){
    const [y, m, d] = dateKey.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    dt.setUTCDate(dt.getUTCDate() - 1);
    return dt.toISOString().slice(0, 10);
  }

  // 04:00, 12:00, 20:00 dan keyin — shu slot. 00:00–03:59 da kechagi 20:00.
  function currentNewsSlot(){
    const { dateKey, hour } = uzNow();
    if (hour >= 20) return { dateKey, slot: '20' };
    if (hour >= 12) return { dateKey, slot: '12' };
    if (hour >= 4) return { dateKey, slot: '04' };
    return { dateKey: yesterdayKey(dateKey), slot: '20' };
  }

  // "2026-08-27" -> "27-avgust, 2026, payshanba" ko'rinishida chiqaradi.
  function formatDateUz(dateKey){
    const [y, m, d] = dateKey.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return dt.toLocaleDateString('uz-UZ', { day:'2-digit', month:'long', year:'numeric', weekday:'long' });
  }

  // Firestore'da manba ikki xil shaklda kelishi mumkin: live feed'da
  // GNews object ({name: "..."}), tarix'da esa biz saqlagan string.
  // Shu funksiya ikkalasini ham to'g'ri o'qiydi.
  function sourceName(a){
    if(!a.source) return "NOMA'LUM";
    return typeof a.source === 'string' ? (a.source || "NOMA'LUM") : (a.source.name || "NOMA'LUM");
  }

  // Global + local aralash, eng yangisidan boshlab
  function sortMixNewest(list){
    return (list || []).slice().sort((a, b) => {
      const tb = Date.parse(b.publishedAt || '') || 0;
      const ta = Date.parse(a.publishedAt || '') || 0;
      if(tb !== ta) return tb - ta;
      return interestScore(b) - interestScore(a);
    });
  }

      feedCount.textContent = '0 TA YANGILIK';
      statusLine.textContent = note || 'KESH BO\'SH';
      return false;
    }
    renderFeed(currentArticles);
    statusLine.textContent = note || ('FIRESTORE — ' + dateKey + ' / SLOT ' + (currentNewsSlot().slot) + ':00');
    fillMissingUzTranslations(currentArticles).catch(e => console.warn('uzText to\'ldirish:', e.message));
    return true;
  }

  // originalText bor, uzText yo'q — faqat shularni bir marta tarjima qilib saqlaydi.
  async function fillMissingUzTranslations(articles){
    if(!articles || !articles.length) return;
    const missing = [];
    for(const a of articles){
      const orig = articleOriginal(a);
      if(!orig.title) continue;
      if(articleUz(a)) continue;
      try{
        const doc = await getArticleDoc(a.id);
        const uz = articleUz(doc);
        if(uz && uz.title){
          a.uzText = doc.uzText || packText(uz.title, uz.desc);
          a.originalText = doc.originalText || packText(orig.title, orig.desc);
          continue;
        }
        if(doc && !doc.originalText){
          await saveTranslation(a.id, '', '', orig.title, orig.desc);
        }
      }catch(e){}
      missing.push({ a, orig });
    }
    if(!missing.length) return;

    const res = await fetch('/api/translate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        items: missing.map((m, i) => ({ id: i, title: m.orig.title, desc: m.orig.desc })),
        target: 'uz'
      })
    });
    if(!res.ok) return;
    const body = await res.json().catch(() => ({}));
    const translated = body.translations || [];
    await Promise.all(translated.map(async (item) => {
      const m = missing[item.id];
      if(!m) return;
      try{
        await saveTranslation(m.a.id, item.title || '', item.desc || '', m.orig.title, m.orig.desc);
        m.a.uzText = packText(item.title || '', item.desc || '');
        m.a.originalText = packText(m.orig.title, m.orig.desc);
      }catch(e){
        console.warn('uzText saqlanmadi:', e.message);
      }
    }));
    if(translateModeOn){
      currentArticles.forEach((a, i) => {
        const uz = articleUz(a);
        if(uz && uz.title) applyTranslation(i, uz.title, uz.desc);
      });
    }
  }

  async function persistGnewsBatch(rawArticles, dateKey, slot, mode){
    const saveMode = mode || 'global';
    markDay(dateKey).catch(e => console.warn('kun belgisi yozilmadi:', e.message));
    const saved = await Promise.all((rawArticles || []).map(async (a) => {
      const id = await hashUrl(a.url || a.title || Math.random().toString());
      try{
        await upsertArticle(id, { ...a, slot }, saveMode, dateKey);
      }catch(e){
        console.warn('Firestore upsert xato:', e.message);
      }
      return cleanArticleText({ ...a, id, slot, mode: saveMode });
    }));
    return saved;
  }

  async function fetchGnewsSlot(dateKey, slot, mode){
    const m = mode === 'local' ? 'local' : 'global';
    const res = await fetch(`/api/gnews?mode=${m}`);
    const data = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    const rawArticles = data.articles || [];
    await persistGnewsBatch(rawArticles, dateKey, slot, m);
    await finishNewsSlot(dateKey, m, slot, { status: 'done', count: rawArticles.length });
  }

  // Bitta mode (global yoki local) uchun slot: kesh / kutish / GNews
  async function syncModeSlot(dateKey, slot, mode){
    let claim;
    try{
      claim = await claimNewsSlot(dateKey, mode, slot);
    }catch(e){
      console.warn('slot claim xato (' + mode + '):', e.message);
      try{ await fetchGnewsSlot(dateKey, slot, mode); }catch(err){
        console.warn('gnews fetch xato (' + mode + '):', err.message);
      }
      return;
    }
    if(claim.action === 'cached') return;
    if(claim.action === 'wait'){
      await waitForNewsSlot(dateKey, mode, slot);
      return;
    }
    try{
      await fetchGnewsSlot(dateKey, slot, mode);
    }catch(err){
      await finishNewsSlot(dateKey, mode, slot, { status: 'error', error: err.message }).catch(() => {});
      console.warn('gnews slot xato (' + mode + '):', err.message);
    }
  }

  // opts.history = true bo'lsa, tepaga "kunlar ro'yxatiga qaytish" tugmasi
  // chiqadi — bu funksiya ham live feed, ham tarix kunini bir xil render
  // qiladi (kod takrorlanmasin deb — story markup ikkalasida ham bir xil).
  function buzzScore(a){
    let s = interestScore(a);
    if(a.image || a.imageUrl || a.urlToImage) s += 4;
    const t = Date.parse(a.publishedAt || '') || 0;
    if(t){
      const hours = (Date.now() - t) / 36e5;
      if(hours < 12) s += 5;
      else if(hours < 24) s += 3;
      else if(hours < 48) s += 1;
    }
    return s;
  }

  function pickFeatured(list){
    if(!list || list.length < 2) return list || [];
    let best = 0, bestS = -1;
    list.forEach((a, i) => {
      const s = buzzScore(a);
      if(s > bestS){ bestS = s; best = i; }
    });
    if(best === 0) return list;
    const out = list.slice();
    const [item] = out.splice(best, 1);
    out.unshift(item);
    return out;
  }

  function interestScore(a){
    const text = ((a.title || '') + ' ' + (a.description || '')).toLowerCase();
    const keys = ['ai','chatgpt','claude','gemini','llm','openai','cursor','copilot','vibe','github','code','programming','python','javascript','typescript','arduino','raspberry','chip','gpu','nvidia','security','hack','startup','hardware','electronics','open source','developer'];
    let s = 0;
    keys.forEach(k => { if(text.includes(k)) s += 2; });
    if((a.description || '').length > 80) s += 1;
    if(a.image || a.imageUrl) s += 1;
    return s;
  }

  function isNearDuplicate(a, pool){
    const t = (a.title || '').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, '').trim();
    const head = t.slice(0, 42);
    if(!head) return true;
    return pool.some(b => {
      const u = (b.title || '').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, '').trim();
      return u.startsWith(head.slice(0, 24)) || u.includes(head.slice(0, 30));
    });
  }

  async function loadMoreFromArchive(){
    const existing = new Set(currentArticles.map(a => a.id));
    const extra = [];
    try{
      const days = await getRecentDays(20);
      for(const day of days){
        // Global + local arxiv birgalikda
        const docs = await getArticlesByDate(day);
        for(const raw of docs || []){
          const a = cleanArticleText(raw);
          if(!a.id || existing.has(a.id)) continue;
          extra.push(a);
          existing.add(a.id);
        }
        if(extra.length >= MORE_FEED) break;
      }
    }catch(e){
      console.warn('arxiv more:', e.message);
    }
    return sortMixNewest(extra);
  }

  async function loadMoreNews(){
    const btn = document.getElementById('moreBtn');
    if(btn){
      btn.disabled = true;
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>';
      btn.setAttribute('title', 'Yuklanmoqda...');
    }
    const target = visibleCount + MORE_FEED;
    let added = 0;
    try{
      if(currentArticles.length >= target){
        visibleCount = target;
        savePrefs();
        currentArticles = sortMixNewest(currentArticles);
        renderFeed(currentArticles);
        return;
      }

      const archived = await loadMoreFromArchive();
      if(archived.length){
        currentArticles = sortMixNewest(currentArticles.concat(archived));
        added += archived.length;
      }

      if(currentArticles.length < target && currentMode !== 'history' && currentMode !== 'saved'){
        const { dateKey, slot } = currentNewsSlot();
        const existing = new Set(currentArticles.map(a => a.id));
        // Global va local navbat bilan
        for(let attempt = 0; attempt < 4 && currentArticles.length < target; attempt++){
          gnewsPage += 1;
          const topic = (gnewsPage + new Date().getHours()) % 6;
          const fetchMode = attempt % 2 === 0 ? 'global' : 'local';
          try{
            const res = await fetch(`/api/gnews?mode=${fetchMode}&more=1&topic=${topic}`);
            const data = await res.json().catch(() => ({}));
            if(!res.ok){
              console.warn('gnews more:', data.error || res.status);
              continue;
            }
            const raw = (data.articles || []).slice();
            const saved = await persistGnewsBatch(raw, dateKey, slot, fetchMode);
            const fresh = saved.filter(a => a.id && !existing.has(a.id) && !isNearDuplicate(a, currentArticles));
            fresh.forEach(a => existing.add(a.id));
            currentArticles = sortMixNewest(currentArticles.concat(fresh));
            added += fresh.length;
          }catch(e){
            console.warn('gnews more urinish:', e.message);
          }
        }
      }

      visibleCount = currentArticles.length >= target
        ? target
        : Math.max(visibleCount, currentArticles.length);
      savePrefs();
      currentArticles = sortMixNewest(currentArticles);
      renderFeed(currentArticles);
      if(added === 0 && currentArticles.length <= visibleCount){
        const again = document.getElementById('moreBtn');
        if(again){
          again.disabled = false;
          again.innerHTML = MORE_BTN_HTML;
        }
      }
    }catch(err){
      console.error(err);
      if(currentArticles.length > visibleCount){
        visibleCount = Math.min(target, currentArticles.length);
        savePrefs();
        renderFeed(currentArticles);
        return;
      }
      const again = document.getElementById('moreBtn');
      if(again){
        again.disabled = false;
        again.innerHTML = MORE_BTN_HTML;
      }
    }
  }

  async function loadSavedFeed(){
    statusLine.textContent = 'SAQLANGANLAR YUKLANMOQDA...';
    const saved = getSavedList();
    if(!saved.length){
      currentArticles = [];
      renderFeed([], { saved: true });
      statusLine.textContent = 'SAQLANGANLAR BO\'SH';
      return;
    }

    // Firestore (userState) snapshot + Firestore article'dan boyitish (rasm, tarjima, sana)
    const enriched = [];
    for(const item of saved){
      let a = {
        id: item.id,
        title: item.title || '',
        description: item.description || '',
        url: item.url || '',
        image: item.image || '',
        source: item.source || '',
        publishedAt: item.publishedAt || '',
        dateKey: item.dateKey || '',
        mode: item.mode || '',
        uzText: item.uzText || '',
        originalText: item.originalText || '',
        savedAt: item.savedAt || ''
      };
      try{
        const doc = await getArticleDoc(item.id);
        if(doc){
          a = {
            ...a,
            title: a.title || doc.title || '',
            description: a.description || doc.description || '',
            url: a.url || doc.url || '',
            image: a.image || doc.image || '',
            source: a.source || doc.source || '',
            publishedAt: a.publishedAt || doc.publishedAt || '',
            dateKey: a.dateKey || doc.dateKey || '',
            mode: a.mode || doc.mode || '',
            uzText: a.uzText || doc.uzText || '',
            originalText: a.originalText || doc.originalText || '',
            aiSharh: doc.aiSharh || doc.explainResult || ''
          };
        }
      }catch(e){
        console.warn('saved enrich:', e.message);
      }
      // Agar uzText bor bo'lsa, kartada o'zbekcha ko'rsatish (UZ TARJIMA kabi)
      const uz = articleUz(a);
      if(uz && uz.title){
        a.title = uz.title;
        if(uz.desc) a.description = uz.desc;
      }
      enriched.push(a);
    }

    currentArticles = enriched;
    renderFeed(enriched, { saved: true });
    statusLine.textContent = enriched.length + ' TA SAQLANGAN';
  }

  // Sidebar "Oxirgi ochilganlar": har doim o'zbekcha sarlavha.
  // Avval eng yaxshi mavjud matn bilan chizamiz, keyin tarjima yo'qlarini
  // API orqali (jumla-jumla) uzbekchaga o'tkazib DOM + Firestore (userState) yangilaymiz.
  function looksNonUzbek(text){
    const t = String(text || '').trim();
    if(!t) return true;
    // Kirill, lotin aralash, fransuz/rus/ingliz belgilar — tarjima kerak
    if(/[а-яА-ЯёЁ]/.test(t)) return true;
    if(/[àâäéèêëïîôùûüÿçœæÀÂÄÉÈÊËÏÎÔÙÛÜŸÇ]/.test(t)) return true;
    // Faqat ASCII + o'zbek lotin harflari bo'lsa ham, inglizcha bo'lishi mumkin —
    // lekin titleUz bor bo'lsa ishonamiz. titleUz yo'q va matn "inglizcha" bo'lsa tarjima.
    // Oddiy heuristika: o'zbek maxsus harflari (o', g', sh, ch, oʻ) yo'q va uzun so'zlar
    // inglizcha ko'rinsa — tarjima.
    if(/[ʻʼ‘’']/.test(t) || /[oʻgʻşčžŋ]/.test(t.toLowerCase())) return false;
    // Qisqa o'zbekcha so'zlar bo'lishi mumkin — lekin shubhali bo'lsa tarjima qilamiz
    // Faqat aniq non-latin yoki aniq rus/fransuz holatida majburiy.
    return false;
  }

  function bestUzTitle(item, live){
    if(live){
      const uz = articleUz(live);
      if(uz && uz.title) return uz.title;
    }
    if(item && item.titleUz) return item.titleUz;
    if(live && live.title) return live.title;
    return (item && item.title) || 'Sarlavhasiz';
  }

  function renderTrending(articles){
    const list = document.getElementById('trending-list');
    const box = document.getElementById('trending');
    if(!list) return;
    const opened = userState.openedItems;
    const savedItems = getSavedList();
    const byId = {};
    (articles || []).forEach(a => { if(a.id) byId[a.id] = a; });
    const picks = [];
    opened.forEach(item => {
      if(item && item.id && picks.length < 6 && !picks.some(p => p.id === item.id)){
        const live = byId[item.id];
        picks.push({
          id: item.id,
          title: bestUzTitle(item, live),
          rawTitle: (live && live.title) || item.title || '',
          needsTranslate: !(item.titleUz || (live && articleUz(live)?.title))
        });
      }
    });
    savedItems.forEach(item => {
      if(picks.length >= 6) return;
      if(!item || !item.id) return;
      if(picks.some(p => p.id === item.id)) return;
      const live = byId[item.id];
      const uzLive = live ? articleUz(live) : null;
      const title = (uzLive && uzLive.title)
        || item.titleUz
        || (live && live.title)
        || item.title
        || 'Saqlangan';
      picks.push({
        id: item.id,
        title,
        rawTitle: (live && live.title) || item.title || '',
        needsTranslate: !(uzLive?.title || item.titleUz)
      });
    });
    if(!picks.length){
      list.innerHTML = '<li class="t-empty">Hali ochilgan yangilik yo\'q</li>';
      if(box) box.style.display = '';
      return;
    }
    list.innerHTML = picks.map((a, k) => `
      <li>
        <span class="t-num">${k+1}.</span>
        <a href="#" data-open-id="${a.id}" data-pick-idx="${k}">${escapeHtml(a.title)}</a>
      </li>`).join('');
    list.querySelectorAll('[data-open-id]').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const target = document.querySelector(`.story[data-id="${link.dataset.openId}"]`);
        if(target){
          const idx = Number(target.dataset.idx);
          if(!target.classList.contains('open')) toggleCardMore(idx);
          // Card ochilishi uning o'z "top" pozitsiyasini o'zgartirmaydi
          // (kengayish faqat pastga qarab bo'ladi), shuning uchun scrollni
          // darhol, kutmasdan boshlasa bo'ladi.
          scrollToStory(target);
        }
      });
    });

    // Fon: o'zbekcha yo'q yoki aniq boshqa tildagi sarlavhalarni tarjima qilamiz
    ensureTrendingUz(picks, list).catch(e => console.warn('trending tarjima:', e.message));
  }

  async function ensureTrendingUz(picks, listEl){
    const need = picks
      .map((p, i) => ({ ...p, i }))
      .filter(p => {
        if(p.needsTranslate) return true;
        return looksNonUzbek(p.title);
      })
      .filter(p => p.rawTitle || p.title);

    if(!need.length) return;

    // Bitta so'rovda barcha kerakli sarlavhalar (API jumla-jumla tarjima qiladi)
    const items = need.map((p, j) => ({
      id: j,
      title: p.rawTitle || p.title,
      desc: ''
    }));

    let translations = [];
    try{
      const res = await fetch('/api/translate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items, target: 'uz' })
      });
      const data = await res.json().catch(() => ({}));
      if(!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      translations = data.translations || [];
    }catch(err){
      console.warn('Sidebar tarjima xato:', err.message);
      return;
    }

    const opened = userState.openedItems;
    let openedChanged = false;

    need.forEach((p, j) => {
      const t = translations[j];
      const titleUz = (t && t.title) ? t.title.trim() : '';
      if(!titleUz) return;

      // DOM yangilash
      const link = listEl.querySelector(`[data-pick-idx="${p.i}"]`);
      if(link){
        link.textContent = titleUz;
        link.classList.add('fade-in');
      }

      // Firestore — keyingi safar darhol o'zbekcha chiqsin
      const idx = opened.findIndex(x => x && x.id === p.id);
      if(idx >= 0){
        opened[idx] = { ...opened[idx], titleUz, title: opened[idx].title || p.rawTitle };
        openedChanged = true;
      }
    });

    if(openedChanged) persistUserState();
  }

  // =========================================================

      const days = await getRecentDays(30);

      const pastDays = days.filter(d => d !== today);

  async function loadHistoryDay(dateKey){
    statusLine.textContent = 'YUKLANMOQDA...';
    feedEl.innerHTML = '<div class="placeholder">SO\'ROV YUBORILMOQDA<span class="cursor"></span></div>';
    feedLabel.textContent = formatDateUz(dateKey).toUpperCase();
    try{

      currentArticles = sortMixNewest((docs || []).map(cleanArticleText));
      renderFeed(currentArticles, { history: true, date: dateKey });

      console.error(err);
      feedEl.innerHTML = `<div class="error-box">XATOLIK: ${escapeHtml(err.message)}</div>`;

  // Bazadagi eski explainResult va chat tarixini panelga qayta chiqaramiz,
  // shunda foydalanuvchi bir marta AI so'ragan narsani ikkinchi marta pul
  // to'lab (token sarflab) so'ramaydi.
  async function restoreCachedState(articleId, idx){
    try{
      const doc = await getArticleDoc(articleId);
      if(doc && (doc.aiSharh || doc.explainResult)){
        const panel = document.getElementById(`ai-panel-${idx}`);
        const body = document.getElementById(`ai-body-${idx}`);
        const translateBody = document.getElementById(`ai-translate-body-${idx}`);
        const btn = document.querySelector(`[data-action="explain"][data-idx="${idx}"]`);
        if(panel && body){
          if(translateBody){
            const uz = articleUz(doc);
            const tTitle = uz?.title || '';
            const tDesc = uz?.desc || '';
            renderMd(translateBody, tTitle + (tDesc ? ('\n\n' + tDesc) : ''));
          }
          renderMd(body, doc.aiSharh || doc.explainResult);
        }
      }
      if(doc && Array.isArray(doc.aiMuhokama) && doc.aiMuhokama.length){
        const chatPanel = document.getElementById(`chat-panel-${idx}`);
        const log = document.getElementById(`chat-log-${idx}`);
        if(chatPanel && log && !log.childElementCount){
          doc.aiMuhokama
            .slice()
            .sort((a, b) => (a.createdAtMs || 0) - (b.createdAtMs || 0))
            .forEach(msg => {
              appendChatMsg(log, msg.role === 'user' ? 'user' : 'ai', msg.content);
            });
        }
      }
    }catch(e){
      console.warn('Firestore restore xato:', e.message);
    }
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // GNews/tarjima ba'zan "o&#39;zining" kabi entity qoldiradi —
  // ekronga va AI'ga xom entity ketmasin.
  function decodeHtml(str){
    if(!str) return '';
    const ta = document.createElement('textarea');
    ta.innerHTML = String(str);
    return ta.value;
  }

  function cleanArticleText(a){
    if(!a) return a;
    if(a.title) a.title = decodeHtml(a.title);
    if(a.description) a.description = decodeHtml(a.description);
    if(a.translatedTitle) a.translatedTitle = decodeHtml(a.translatedTitle);
    if(a.translatedDesc) a.translatedDesc = decodeHtml(a.translatedDesc);
    if(a.originalText) a.originalText = decodeHtml(a.originalText);
    if(a.uzText) a.uzText = decodeHtml(a.uzText);
    return a;
  }

  // =========================================================
  // 3) "TARJIMA + TUSHUNTIRISH"
  //    Ikki bosqich, ikkalasi ham bir marta ishlaydi, natija Firestore'da
  //    keshlanadi:
  //    1-bosqich: /api/translate (Google Translate, AI EMAS, bepul) —
  //               sarlavha+tavsifni o'zbekchaga tarjima qiladi, ekranda
  //               tepada ko'rsatiladi.
  //    2-bosqich: Groq (/api/ai-chat) — o'sha tarjima asosida batafsil
  //               tushuntirish yozadi (auto-detect qilib, har doim o'zbekcha
  //               javob beradi).
  //    Ikkalasi ham tugagach bittada Firestore'ga yoziladi. Keyingi safar
  //    tugma bosilganda — yoki sahifa qayta ochilganda (restoreCachedState) —
  //    Firestore'da explainResult borligi tekshiriladi va bor bo'lsa
  //    /api/translate HAM, Groq HAM UMUMAN CHAQIRILMAYDI, faqat DOM'ga
  //    keshdagi matn qo'yiladi.
  // =========================================================
  async function toggleCardMore(idx){
    const card = document.querySelector(`.story[data-idx="${idx}"]`);
    if(!card) return;

    // Bosishdan OLDIN scroll ni qotiramiz — keyin layout o'zgarsa ham joyida qoladi
    const y = getScrollY();
    pinScroll(2500, y);

    // Bir nechta card bir vaqtda ochiq bo'lishi mumkin (accordion yo'q)
    const open = card.classList.toggle('open');
    const moreBtn = card.querySelector('.card-more');
    if(moreBtn) moreBtn.setAttribute('title', open ? 'Yopish' : 'Batafsil');

    pinScroll(2500, y);

    if(open){
      const a = currentArticles[idx];
      markOpened(a);
      card.classList.add('read');
      renderTrending(currentArticles);
      pinScroll(3000, y);
      await toggleDiscuss(idx);
      pinScroll(3000, y);
      await handleExplain(idx);
      pinScroll(800, y);
    }
  }

  async function handleExplain(idx, btn){
    const a = currentArticles[idx];
    if(!a) return;
    const panel = document.getElementById(`ai-panel-${idx}`);
    const body = document.getElementById(`ai-body-${idx}`);
    const translateBody = document.getElementById(`ai-translate-body-${idx}`);
    if(!panel || !body || !translateBody) return;
    pinScroll(2500);
    if(btn) btn.disabled = true;
    panel.classList.add('show');

    // 0-qadam: Firestore keshini tekshiramiz — bor bo'lsa na tarjima,
    // na Groq chaqirilmaydi, to'g'ridan-to'g'ri keshdan chiqadi.
    try{
      const cached = await getArticleDoc(a.id);
      if(cached && (cached.aiSharh || cached.explainResult)){
        const uz = articleUz(cached);
        const tTitle = uz?.title || '';
        const tDesc = uz?.desc || '';
        if(tTitle){
          a.uzText = packText(tTitle, tDesc || '');
          try{
            const opened = userState.openedItems;
            const oi = opened.findIndex(x => x && x.id === a.id);
            if(oi >= 0){
              opened[oi] = { ...opened[oi], titleUz: tTitle, title: opened[oi].title || a.title };
              persistUserState();
              renderTrending(currentArticles);
            }
          }catch(_){}
        }
        a.aiSharh = cached.aiSharh || cached.explainResult || '';
        a.explainResult = a.aiSharh;
        // fade-in o'rniga so'zma-so'z reveal
        await revealWordsSmooth(translateBody, tTitle + (tDesc ? ('\n\n' + tDesc) : ''), { markdown: true, delay: 38 });
        await new Promise(r => setTimeout(r, 120));
        await revealWordsSmooth(body, a.aiSharh, { markdown: true, delay: 38 });
        return;
      }
    }catch(e){
      console.warn('Kesh tekshirishda xato (davom etamiz):', e.message);
    }

    // 1-qadam: haqiqiy tarjima (Google Translate, key kerak emas, Groq bilan
    // aloqasi yo'q — shuning uchun Groq band bo'lsa ham bu qadam ishlaydi).
    if(btn) btn.textContent = 'TARJIMA QILINMOQDA...';
    translateBody.innerHTML = '<span class="ai-loading">Tarjima qilinmoqda...</span>';
    body.innerHTML = '';

    const orig = articleOriginal(a);
    let titleUz = orig.title;
    let descUz = orig.desc;
    try{
      const cachedDoc = await getArticleDoc(a.id);
      const cachedUz = articleUz(cachedDoc || a);
      if(cachedUz && cachedUz.title){
        titleUz = cachedUz.title;
        descUz = cachedUz.desc;
        // Keshdan — biroz sekinroq ko'rinsin (smooth)
        await new Promise(r => setTimeout(r, 200));
      }else{
        const res = await fetch('/api/translate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            items: [{ id: 0, title: orig.title, desc: orig.desc }],
            target: 'uz'
          })
        });
        const tBody = await res.json().catch(() => ({}));
        if(!res.ok) throw new Error(tBody.error || `Tarjima xatoligi (HTTP ${res.status})`);
        const t = (tBody.translations || [])[0];
        if(t){ titleUz = t.title || titleUz; descUz = t.desc || descUz; }
        await saveTranslation(a.id, titleUz, descUz, orig.title, orig.desc);
        a.uzText = packText(titleUz, descUz);
        a.originalText = packText(orig.title, orig.desc);
      }
      // Sidebar "Oxirgi ochilganlar" uchun o'zbekcha sarlavhani saqlab qo'yamiz
      try{
        const opened = userState.openedItems;
        const oi = opened.findIndex(x => x && x.id === a.id);
        if(oi >= 0 && titleUz){
          opened[oi] = { ...opened[oi], titleUz, title: opened[oi].title || orig.title };
          persistUserState();
          renderTrending(currentArticles);
        }
      }catch(_){}
      await revealWordsSmooth(translateBody, titleUz + (descUz ? ('\n\n' + descUz) : ''), { markdown: true, delay: 38 });
    }catch(err){
      await revealWordsSmooth(translateBody, 'Tarjima qilinmadi (' + err.message + '), asl matn bilan davom etamiz.', { delay: 36 });
    }

    // 2-qadam: Groq — endi asl matn emas, TARJIMA QILINGAN o'zbekcha matn
    // asosida ishlaydi. Til qanday bo'lishidan qat'i nazar (auto-detect),
    // javobni har doim faqat o'zbek tilida yozishi qattiq talab qilinadi.
    if(btn) btn.textContent = 'TUSHUNTIRILMOQDA...';
    body.innerHTML = '<span class="ai-loading">AI o\'ylamoqda...</span>';
    await new Promise(r => setTimeout(r, 180));

    const sys = `Sen tajribali xalqaro yangiliklar sharhlovchisisan. Foydalanuvchi senga allaqachon o'zbek tiliga tarjima qilingan sarlavha va tavsifni beradi (lekin asl til har xil bo'lishi mumkin — ingliz, rus va h.k., buni avtomatik aniqlab ol). Javobingni QATIYAN FAQAT O'ZBEK TILIDA yoz, boshqa hech qanday tilda emas. Quyidagi tartibda javob ber:
Quyidagi tartibda, qisqa va aniq yoz:
**Xulosa**
3 ta oddiy gap: nima bo'ldi, kim ishtirok etdi.
**Nega muhim**
2 gap: dasturchi yoki texnologiya olami uchun nima o'zgaradi.
**Keyingi qadam**
1 gap: bu nima olib kelishi mumkin.
Murakkab so'zlarni tushuntir. Taxminni fakt qilib yozma. Sarlavhani takrorlama.`;

    const userMsg = `Sarlavha (o'zbekcha): ${titleUz}\nTavsif (o'zbekcha): ${descUz}\nManba: ${sourceName(a)}`;

    try{
      const result = await aiChat([
        { role: 'system', content: sys },
        { role: 'user', content: userMsg }
      ]);
      await revealWordsSmooth(body, result || 'AI bo\'sh javob qaytardi.', { markdown: true, delay: 38 });

      // Natijani (tarjima + tushuntirish) birgalikda Firestore'ga yozamiz —
      // keyingi safar shu article uchun 0-qadam buni topadi va na tarjima,
      // na Groq qayta chaqirilmaydi.
      try{
        const origSave = articleOriginal(a);
        await saveTranslation(a.id, titleUz, descUz, origSave.title, origSave.desc);
        await saveExplainResult(a.id, result || '');
        // Lokal ham yangilaymiz — chat konteksti darhol ko'rsin
        a.aiSharh = result || '';
        a.explainResult = result || '';
      }catch(e){
        console.warn('explainResult/tarjima saqlanmadi:', e.message);
      }

    }catch(err){
      // Bratishka, MUHIM: xato bo'lganda tugmani yashirmaymiz — aks holda
      // odam qayta urinib ko'ra olmay qoladi. Faqat muvaffaqiyatda yo'qoladi.
      body.textContent = 'XATOLIK: ' + err.message;
      if(btn){
        btn.textContent = 'Tarjima + Tushuntirish';
        btn.disabled = false;
      }
    }
  }

  // =========================================================
  // 4) "MUHOKAMA QILISH" — chat tarixi endi Firestore subcollection'da.
  //    RAM'dagi chatHistories — shu sessiya davomidagi ishchi nusxa,
  //    lekin har xabar Firestore'ga ham yoziladi, sahifa yangilansa yo'qolmaydi.
  // =========================================================
  const chatHistories = {}; // idx -> [{role, content}]  (system prompt shu yerda saqlanadi, DB'ga yozilmaydi)
  const chatLoaded = {};    // idx -> bool, DB'dan tarix bir marta yuklandimi

  // Har safar yangilangan kontekst — sana, manba, AI sharh (agar bor)
  function buildChatSystemPrompt(a){
    const orig = articleOriginal(a);
    const uz = articleUz(a);
    const topicTitle = decodeHtml((uz && uz.title) || orig.title || a.title || '');
    const topicDesc = decodeHtml((uz && uz.desc) || orig.desc || a.description || '');
    const src = sourceName(a);
    let pubDateStr = '';
    try{
      if(a.publishedAt){
        const d = new Date(a.publishedAt);
        if(!isNaN(d.getTime())){
          pubDateStr = d.toLocaleString('uz-UZ', {
            year: 'numeric', month: 'long', day: 'numeric',
            hour: '2-digit', minute: '2-digit'
          });
        }
      }
    }catch(_){}
    const explain = (a.aiSharh || a.explainResult || '').toString().trim();
    const explainBlock = explain
      ? `\nAI tushuntirishi (allaqachon berilgan, shunga tayangan holda javob ber):\n${explain.slice(0, 1800)}`
      : '';

    return `Sen FAQAT shu bitta yangilik haqida gaplashadigan suhbatdoshisan. Boshqa mavzuga o'tma.

=== ICHKI KONTEKST (foydalanuvchiga so'zma-so'z o'qib berma, lekin bilib ol va shunga asoslan) ===
Sarlavha: ${topicTitle}
Tavsif: ${topicDesc}
Manba: ${src}
${pubDateStr ? "E'lon qilingan sana: " + pubDateStr : "E'lon qilingan sana: noma'lum (taxmin qilma)"}
${explainBlock}
=== KONTEKST TUGADI ===

QATIY QOIDALAR:
1) FAQAT yuqoridagi kontekst, (agar berilgan bo'lsa) jonli qidiruv natijalari va suhbat tarixidagi faktlarga tayan. Bilmagan narsangni O'YLAB TOPMA (sana, raqam, ism, sabab).
2) Agar kontekstda yo'q bo'lsa — ochiq ayt: "Bu haqda maqolada aniq ma'lumot yo'q" yoki "Aniq sanani bilmayman".
3) To'liq sarlavhani yoki tavsifni so'zma-so'z takrorlama.
4) "Qanday yordam bera olaman?" deb yozma. Umumiy chatbot ohangi taqiqlanadi.
5) Salom / qisqa xabarda: 1 qisqa, tabiiy savol yoki 1-2 gaplik qisqa javob.
   YAXSHI: "Salom! Anthropic va Trump ma'muriyati haqidagi bu xabar qiziqtirdimi?"
   YOMON: "Salom! ... Qanday yordam bera olaman?"
6) Sana so'ralsa — faqat kontekstdagi "E'lon qilingan sana"ni ayt. Yo'q bo'lsa — bilmasligingni ayt, o'ylab topma.
7) Javoblaring o'zbekcha, qisqa va aniq. Kerak bo'lsa keyin chuqurlash.
8) MAVZU CHUQURLIGI: siz shu sohaning tajribali tahlilchisisiz — sayoz, umumiy gaplar bilan cheklanma. Foydalanuvchi texnik yoki chuqur savol bersa (masalan, model arxitekturasi, kompaniya strategiyasi, texnik tafsilotlar haqida), aniq, mazmunli, ekspert darajadagi javob ber — lekin baribir faqat ISHONCHLI kontekst/qidiruv natijalariga asoslanib, spekulyatsiyani aniq spekulyatsiya deb belgilab.
9) Agar mavzu Claude, Anthropic yoki boshqa AI modellari haqida bo'lsa va sizga "JONLI QIDIRUV NATIJALARI" bloki berilgan bo'lsa — shu ma'lumotni o'zingdagi eski xotiradan USTUN qo'y, chunki AI sohasi tez o'zgaradi va eski ma'lumot noto'g'ri bo'lishi mumkin.`;
  }

  async function toggleDiscuss(idx){
    const panel = document.getElementById(`chat-panel-${idx}`);
    if(panel) panel.classList.add('show');
    if(chatLoaded[idx] && chatHistories[idx]) return;

    const a = currentArticles[idx];
    if(!chatHistories[idx]){
      chatHistories[idx] = [
        { role: 'system', content: buildChatSystemPrompt(a) }
      ];
    }

    if(!chatLoaded[idx]){
      chatLoaded[idx] = true;
      const log = document.getElementById(`chat-log-${idx}`);
      try{
        const history = await loadChatHistory(a.id); // [{role, content, createdAt}]
        history.forEach(msg => {
          chatHistories[idx].push({ role: msg.role, content: msg.content });
          appendChatMsg(log, msg.role === 'user' ? 'user' : 'ai', msg.content);
        });
      }catch(e){
        console.warn('Chat tarixi yuklanmadi:', e.message);
      }
    }
  }

  async function handleSend(idx){
    const input = document.getElementById(`chat-input-${idx}`);
    const log = document.getElementById(`chat-log-${idx}`);
    const btn = document.querySelector(`[data-action="send"][data-idx="${idx}"]`);
    const text = input.value.trim();
    if(!text) return;

    pinScroll(2500);
    const a = currentArticles[idx];
    if(!chatHistories[idx]) await toggleDiscuss(idx);

    appendChatMsg(log, 'user', text);
    chatHistories[idx].push({ role: 'user', content: text });
    input.value = '';
    input.disabled = true;
    btn.disabled = true;

    appendChatMessage(a.id, 'user', text).catch(e => console.warn('chat write xato:', e.message));

    // Har so'rovda kontekstni yangilaymiz (sana, AI sharh — agar keyinroq chiqqan bo'lsa)
    if(chatHistories[idx][0] && chatHistories[idx][0].role === 'system'){
      chatHistories[idx][0].content = buildChatSystemPrompt(a);
    }

    const thinkingEl = appendChatMsg(log, 'ai', 'AI yozmoqda...', { loading: true });
    pinScroll(2500);

    try{
      const result = await aiChat(chatHistories[idx]);
      pinScroll(2000);
      thinkingEl.classList.remove('ai-loading-msg');
      await revealWordsSmooth(thinkingEl, result, { markdown: true, delay: 34 });
      chatHistories[idx].push({ role: 'assistant', content: result });
      appendChatMessage(a.id, 'assistant', result).catch(e => console.warn('chat write xato:', e.message));
    }catch(err){
      thinkingEl.classList.remove('ai-loading-msg');
      thinkingEl.textContent = 'XATOLIK: ' + err.message;
    }finally{
      input.disabled = false;
      btn.disabled = false;
      try{ input.focus({ preventScroll: true }); }catch(_){}
      // Faqat chat-log ichida pastga — window scroll qilinmaydi
      try{ log.scrollTop = log.scrollHeight; }catch(_){}
      pinScroll(400);
    }
  }

  function appendChatMsg(log, role, text, opts = {}){
    pinScroll(600);
    const div = document.createElement('div');
    div.className = 'chat-msg ' + role;
    // Bratishka, MUHIM: faqat AI xabari markdown sifatida render qilinadi.
    // User yozgan matnni HAR DOIM xom textContent qilib qo'yamiz — u odam
    // yozgan matn, uni HTML/markdown deb parse qilishning hojati yo'q va
    // xavfsizlik nuqtai nazaridan ham to'g'ri emas.
    if(opts.loading){
      div.classList.add('ai-loading-msg');
      div.innerHTML = '<span class="ai-loading">' + (text || '...') + '</span>';
    }else if(role === 'ai'){
      renderMd(div, text);
    }else{
      div.textContent = text;
    }
    log.appendChild(div);
    try{ log.scrollTop = log.scrollHeight; }catch(_){}
    pinScroll(400);
    return div;
  }

  // =========================================================
  // 5) "UZ TARJIMA" TOGGLE — barcha ko'rinayotgan article'larni
  //    bitta AI so'rovda (batch) tarjima qilamiz, qayta bossa
  //    asl (original) matnga qaytaramiz. AI qayta chaqirilmaydi —
  //    original matn xotirada saqlanadi.
  // =========================================================
  const translateBtn = document.getElementById('translateAllBtn');
  const translateLabel = document.getElementById('translateAllLabel');

  translateBtn.addEventListener('click', () => {
    if(isTranslating) return; // AI javob kutayotganda qayta bosishni bloklaymiz
    if(translateModeOn){
      revertTranslation();
    }else{
      translateAllArticles();
    }
  });

  // Original matnni original tilga qaytaradi — AI kerak emas, tezkor.
  function revertTranslation(){
    currentArticles.forEach((a, i) => {
      const orig = originalTexts[i];
      if(!orig) return;
      const titleLink = document.getElementById(`title-link-${i}`);
      const descEl = document.getElementById(`desc-${i}`);
      if(titleLink){
        titleLink.textContent = orig.title;
        titleLink.parentElement.classList.remove('translated');
      }
      const trend = document.getElementById(`trend-link-${i}`);
      if(trend) trend.textContent = orig.title;
      if(descEl){
        descEl.textContent = orig.desc;
        descEl.classList.remove('translated');
      }
    });
    translateModeOn = false;
    translateBtn.classList.remove('active');
    if(translateLabel) translateLabel.textContent = 'UZ';
    translateBtn.setAttribute('title', 'UZ tarjima');
    savePrefs();
  }

  // DOM'ga tarjima matnini qo'yadi + "translated" belgisini yoqadi.
  // Ham keshdan (Firestore) kelgan, ham yangi AI natijasi shu orqali chiqadi.
  function applyTranslation(i, title, desc){
    title = decodeHtml(title || '');
    desc = decodeHtml(desc || '');
    const titleLink = document.getElementById(`title-link-${i}`);
    const descEl = document.getElementById(`desc-${i}`);
    if(titleLink && title){
      titleLink.textContent = title;
      titleLink.parentElement.classList.add('translated');
    }
    const trend = document.getElementById(`trend-link-${i}`);
    if(trend && title) trend.textContent = title;
    if(descEl && desc){
      descEl.textContent = desc;
      descEl.classList.add('translated');
    }
  }

  // Barcha ko'rinayotgan article'larni tarjima qiladi — LEKIN avval Firestore'dan
  // tekshiradi: bu article ilgari tarjima qilingan bo'lsa (translatedTitle mavjud),
  // AI UMUMAN CHAQIRILMAYDI, keshdan to'g'ridan-to'g'ri chiqadi. Faqat hali
  // tarjima qilinmagan article'lar bitta batch AI so'rovga tushadi (token tejash —
  // 15 ta alohida so'rov o'rniga bitta prompt).
  // Natija darhol Firestore'ga yoziladi — ertaga shu yangilik "tarix"da ochilsa ham
  // qayta tarjima qilinmaydi, chunki translatedTitle/translatedDesc doc'ida saqlanadi.
  async function translateAllArticles(){
    if(!currentArticles.length) return;
    isTranslating = true;
    translateBtn.classList.add('loading');
    if(translateLabel) translateLabel.textContent = '...';
    translateBtn.setAttribute('title', 'Tarjima qilinmoqda...');

    // Original matnlarni saqlab qo'yamiz (agar hali saqlanmagan bo'lsa) —
    // shunda keyinchalik "qaytarish" tugmasi qayerga qaytishni biladi.
    currentArticles.forEach((a, i) => {
      if(!originalTexts[i]){
        originalTexts[i] = articleOriginal(a);
      }
    });

    try{
      const cacheChecks = await Promise.all(currentArticles.map(async (a) => {
        try{
          const doc = await getArticleDoc(a.id);
          const uz = articleUz(doc || a);
          return (uz && uz.title) ? uz : null;
        }catch(e){
          return articleUz(a);
        }
      }));

      const needsAiIdx = [];
      currentArticles.forEach((a, i) => {
        const cached = cacheChecks[i];
        if(cached){
          applyTranslation(i, cached.title, cached.desc); // AI chaqirilmadi — bepul, tezkor
        }else{
          needsAiIdx.push(i);
        }
      });

      // 2-qadam: faqat keshda YO'Q bo'lganlarni tarjima API'ga yuboramiz.
      // MUHIM: bu AI EMAS — /api/translate alohida, haqiqiy tarjima xizmati.
      // Groq/AI faqat "Muhokama qilish" chatida ishlatiladi, tarjimada YO'Q.
      if(needsAiIdx.length){
        const payload = needsAiIdx.map(i => ({
          id: i,
          title: originalTexts[i].title,
          desc: originalTexts[i].desc
        }));

        const res = await fetch('/api/translate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items: payload, target: 'uz' })
        });
        const body = await res.json().catch(() => ({}));
        if(!res.ok){
          throw new Error(body.error || `Tarjima xatoligi (HTTP ${res.status})`);
        }

        const translated = body.translations;
        if(!Array.isArray(translated)){
          throw new Error('Tarjima xizmati massiv qaytarmadi.');
        }

        // 3-qadam: DOM'ga chiqaramiz VA Firestore'ga yozamiz — shunda keyingi safar
        // shu article uchun bu qadam butunlay o'tkazib yuboriladi (1-qadamda kesh topiladi).
        await Promise.all(translated.map(async (item) => {
          const i = item.id;
          applyTranslation(i, item.title, item.desc);
          const a = currentArticles[i];
          if(!a) return;
          try{
            const orig = originalTexts[i] || articleOriginal(a);
            await saveTranslation(a.id, item.title || '', item.desc || '', orig.title, orig.desc);
            a.uzText = packText(item.title || '', item.desc || '');
            a.originalText = packText(orig.title, orig.desc);
          }catch(e){
            console.warn('tarjima Firestore\'ga saqlanmadi:', e.message);
          }
        }));
      }

      translateModeOn = true;
      translateBtn.classList.add('active');
      if(translateLabel) translateLabel.textContent = 'ORIG';
      translateBtn.setAttribute('title', 'Original tilga qaytarish');
      savePrefs();
    }catch(err){
      console.error('Translate all xato:', err);
      statusLine.textContent = 'TARJIMA XATOLIGI: ' + err.message;
      if(translateLabel) translateLabel.textContent = 'UZ';
      translateBtn.setAttribute('title', 'UZ tarjima');
    }finally{
      isTranslating = false;
      translateBtn.classList.remove('loading');
    }
  }

  // =========================================================
  // 6) AUTO REFRESH + INIT
  // =========================================================
  function scheduleRefresh(){
    if(refreshTimer) clearInterval(refreshTimer);
    // Bratishka, MUHIM: agar foydalanuvchi hozir TARIX'ni ko'rib o'tirgan bo'lsa,
    // 30 daqiqalik auto-refresh loadFeed()ni chaqirib, ekranini "bugungi feed"ga
    // almashtirib yubormasligi kerak edi — shu yerda guard qo'yilmasa, odam
    // 3 kun oldingi yangilikni o'qiyotganda ekran birdan sakrab ketardi.
    refreshTimer = setInterval(() => {
      if(currentMode === 'home') loadFeed();
    }, 30 * 60 * 1000);
  }

  const themeBtn = document.getElementById('themeToggle');
  const themeLabel = document.getElementById('themeLabel');
  function applyThemeLabel(){
    const now = document.documentElement.getAttribute('data-theme') || 'dark';
    if(themeLabel) themeLabel.textContent = now === 'light' ? 'Light' : 'Dark';
    if(themeBtn) themeBtn.setAttribute('title', now === 'light' ? 'Light mode' : 'Dark mode');
  }
  applyThemeLabel();
  if(themeBtn){
    themeBtn.addEventListener('click', () => {
      const now = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', now);
      try{ localStorage.setItem('fmn-theme', now); }catch(e){}
      persistUserState();
      applyThemeLabel();
    });
  }

  // Ilova Firestore'dagi foydalanuvchi holatini KUTIB oladi, keyin
  // sozlamalarni tiklaydi va feedni yuklaydi — localStorage'dan sinxron
  // o'qish endi yo'q, shuning uchun bu qadam async.
  (async function initApp(){
    await loadUserStateFromFirestore();

    loadPrefs();
    setBodyMode(currentMode);
    tabs.forEach(b => {
      b.classList.toggle('active', b.dataset.mode === currentMode);
    });
    if(translateModeOn){
      translateBtn.classList.add('active');
      if(translateLabel) translateLabel.textContent = 'ORIG';
      translateBtn.setAttribute('title', 'Original tilga qaytarish');
    }
    // Birinchi tashrif: UZ default — holatni yozib qo'yamiz
    if(userState.translateOn === null){
      userState.translateOn = true;
      translateModeOn = true;
      translateBtn.classList.add('active');
      if(translateLabel) translateLabel.textContent = 'ORIG';
      persistUserState();
    }

    if(currentMode === 'history'){
      feedLabel.textContent = "TARIX — KUNLARNI TANLA";
      renderDayList();
    }else if(currentMode === 'saved'){
      feedLabel.textContent = "SAQLANGANLAR";
      loadSavedFeed();
    }else{
      currentMode = 'home';
      feedLabel.textContent = "Bugungi to'plam";
      loadFeed();
    }

    scheduleRefresh();
  })();

  document.addEventListener('keydown', (e) => {
    const tag = (e.target && e.target.tagName) || '';
    if(tag === 'INPUT' || tag === 'TEXTAREA') return;
    if(e.key !== 'j' && e.key !== 'k' && e.key !== 'J' && e.key !== 'K') return;
    const cards = Array.from(document.querySelectorAll('#feed .story'));
    if(!cards.length) return;
    const current = document.querySelector('#feed .story.open') || cards[0];
    const i = cards.indexOf(current);
    const next = e.key.toLowerCase() === 'j' ? Math.min(cards.length - 1, i + 1) : Math.max(0, i - 1);
    const card = cards[next];
    if(!card) return;
    // Autoscroll yo'q — faqat more ochish/yopish
    const idx = Number(card.dataset.idx);
    if(!Number.isNaN(idx)) toggleCardMore(idx);
  });
})();
</script>
