<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FMN — ForMrNews</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&display=swap');

  :root{
    --paper:#0d0d0c;
    --paper-raised:#161613;
    --ink:#ecebe4;
    --ink-dim:#8a8a7d;
    --wire-red:#c23b2e;
    --wire-amber:#d9a441;
    --wire-green:#5a9b6f;
    --line:#2a2a24;
    --mono: 'JetBrains Mono', monospace;
    --serif: 'Newsreader', serif;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html{
    scrollbar-width:thin;               /* Firefox — tor va neytral */
    scrollbar-color:var(--line) var(--paper);
  }

  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* Butun sayt bo'ylab bitta xira, tor, dark-theme scrollbar —
     brauzerning default oq/qalin scrollbari umuman chiqmasin. */
  ::-webkit-scrollbar{
    width:8px;
    height:8px;
  }
  ::-webkit-scrollbar-track{
    background:var(--paper);
  }
  ::-webkit-scrollbar-thumb{
    background:var(--line);
    border-radius:4px;
  }
  ::-webkit-scrollbar-thumb:hover{
    background:var(--ink-dim);
  }

  header{
    border-bottom:1px solid var(--line);
    padding:12px 32px;
    position:sticky;
    top:0;
    background:var(--paper);
    z-index:50;
  }

  .masthead-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--wire-red);
    display:inline-block;
    animation:pulse 1.6s infinite;
  }

  nav.top-nav{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  nav.top-nav .hdr-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#141414;
    border:1px solid #2a2a2a;
    color:#f2f2f2;
    font-family:var(--mono);
    font-size:12px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:10px 16px;
    cursor:pointer;
    border-radius:8px;
    text-decoration:none;
    transition:.15s;
    white-space:nowrap;
  }
  nav.top-nav .hdr-btn:hover{
    background:#1c1c1c;
    border-color:#3a3a3a;
  }
  nav.top-nav .hdr-btn.active{
    background:var(--wire-red);
    border-color:var(--wire-red);
    color:#fff;
  }
  nav.top-nav .hdr-btn.loading{
    opacity:.6;
    cursor:wait;
  }
  nav.top-nav .hdr-ico{
    width:16px;
    height:16px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  nav.top-nav .hdr-ico svg{
    width:16px;
    height:16px;
    display:block;
  }

  .masthead-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-bottom:14px;
    flex-wrap:wrap;
    gap:6px;
  }

  #clock{color:var(--wire-amber); font-weight:700;}
  #aiStatus{color:var(--ink-dim);}
  #aiStatus.ok{color:var(--wire-green);}
  #aiStatus.bad{color:var(--wire-red);}
  #dbStatus{color:var(--ink-dim);}
  #dbStatus.ok{color:var(--wire-green);}
  #dbStatus.bad{color:var(--wire-red);}

  .masthead-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }

  h1{
    font-family:var(--mono);
    font-weight:800;
    font-size:22px;
    letter-spacing:-0.01em;
    display:flex;
    align-items:center;
    gap:10px;
  }
  h1 span.blink{
    width:10px;height:10px;border-radius:50%;
    background:var(--wire-red);
    display:inline-block;
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(194,59,46,.5);}
    50%{opacity:.4;box-shadow:0 0 0 6px rgba(194,59,46,0);}
  }

  .status-line{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    text-transform:uppercase;
    letter-spacing:0.05em;
  }

  .translate-btn.active{
    background:var(--wire-green);
    border-color:var(--wire-green);
    color:#0d0d0c;
  }
  .translate-btn.loading svg{
    animation:spin 1s linear infinite;
  }
  @keyframes spin{
    100%{transform:rotate(360deg);}
  }
  .desc.translated, h2.translated a{
    color: var(--wire-green);
  }
  .translated-badge{
    font-family:var(--mono);
    font-size:9px;
    color:var(--wire-green);
    text-transform:uppercase;
    letter-spacing:.06em;
    margin-left:6px;
  }

  /* Bratan, pastki "control-bar" — soat, DB/AI status, tarjima tugmasi va
     tab'lar shu qatorga tushdi. Asosiy header endi toza gazeta-masthead,
     texnik status/kontrol qismi esa alohida ingichka chiziq ostida. */
  .control-bar{
    max-width:1160px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    padding:10px 32px;
    border-bottom:1px solid var(--line);
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-dim);
    letter-spacing:.06em;
    text-transform:uppercase;
  }
  .control-bar .control-left{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .control-bar .control-right{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }

  .tab-btn.active{
    background:var(--wire-red);
    border-color:var(--wire-red);
    color:#fff;
    font-weight:700;
  }

  /* Bratishka, ASOSIY O'ZGARISH shu yerda: main endi 2-column grid —
     chapda feed (hero + story ro'yxati), o'ngda "ENG KO'P O'QILGANLAR"
     sidebar. 900px ustunli, mono-column "terminal" layout screenshot'dagi
     klassik gazeta-uslub 2-column'ga aylandi. */
  main{
    max-width:1160px;
    margin:0 auto;
    padding:28px 32px 80px;
    display:grid;
    grid-template-columns:1fr 300px;
    gap:48px;
    align-items:start;
  }

  #feed-col{ min-width:0; }

  #feed-meta{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    text-transform:uppercase;
    letter-spacing:.06em;
    margin-bottom:18px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
  }

  /* HERO — birinchi story (index 0) katta blok bo'lib chiqadi, screenshot'dagi
     rasm+katta sarlavha kabi. GNews rasm bermasa ham joy egallab turadi,
     kelajakda <img> qo'shsang shu joyga tushadi. */
  .story.hero{
    display:block;
    padding:0 0 26px;
    border-bottom:1px solid var(--line);
    margin-bottom:22px;
  }
  .story.hero .hero-media{
    width:100%;
    aspect-ratio:16/9;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:2px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:16px;
    overflow:hidden;
    position:relative;
  }
  .story.hero .hero-media img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    position:absolute;
    inset:0;
  }
  .story.hero .story-index{
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:8px;
  }
  .story.hero h2{
    font-size:28px;
    line-height:1.25;
  }
  .story.hero p.desc{ font-size:15.5px; }

  .story{
    padding:22px 0;
    border-bottom:1px solid var(--line);
    display:grid;
    grid-template-columns:90px 1fr;
    gap:18px;
  }
  #feed-col > .story:last-of-type{ border-bottom:none; }

  .story-index{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    padding-top:4px;
  }
  .story-index .src{
    display:block;
    color:var(--wire-amber);
    font-weight:700;
    margin-top:4px;
    text-transform:uppercase;
    font-size:10px;
  }

  .story h2{
    font-family:var(--serif);
    font-weight:600;
    font-size:20px;
    line-height:1.3;
    margin-bottom:8px;
  }
  .story h2 a{color:var(--ink); text-decoration:none;}
  .story h2 a:hover{color:var(--wire-amber);}

  .story p.desc{
    font-size:14.5px;
    line-height:1.55;
    color:#c9c8bd;
    font-style:italic;
  }

  /* SIDEBAR — "ENG KO'P O'QILGANLAR". JS orqali currentArticles'ning
     birinchi 4 tasidan sarlavha olib to'ldiraman (renderFeed ichida). */
  aside#trending{
    position:sticky;
    top:90px;
  }
  aside#trending h3{
    font-family:var(--mono);
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--wire-red);
    padding-bottom:10px;
    margin-bottom:14px;
    border-bottom:2px solid var(--line);
  }
  #trending-list{
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  #trending-list li{
    display:flex;
    gap:10px;
    align-items:baseline;
  }
  #trending-list .t-num{
    font-family:var(--mono);
    font-weight:800;
    font-size:13px;
    color:var(--ink-dim);
    flex-shrink:0;
  }
  #trending-list a{
    color:var(--ink);
    text-decoration:none;
    font-size:14px;
    line-height:1.4;
    font-family:var(--serif);
    font-weight:500;
  }
  #trending-list a:hover{ color:var(--wire-amber); }

  .story .meta{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-dim);
    margin-top:10px;
    text-transform:uppercase;
    letter-spacing:.04em;
  }

  .ai-toolbar{
    display:flex;
    gap:8px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .ai-btn{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-dim);
    padding:6px 10px;
    cursor:pointer;
    transition:.15s;
  }
  .ai-btn:hover{border-color:var(--wire-amber); color:var(--wire-amber);}
  .ai-btn:disabled{opacity:.4; cursor:wait;}

  .ai-panel{
    margin-top:12px;
    border-left:2px solid var(--wire-amber);
    padding:10px 14px;
    background:var(--paper-raised);
    display:none;
  }
  .ai-panel.show{display:block;}
  .ai-panel .ai-tag{
    font-family:var(--mono);
    font-size:9.5px;
    color:var(--wire-amber);
    text-transform:uppercase;
    letter-spacing:.08em;
    margin-bottom:6px;
    display:flex;
    justify-content:space-between;
  }
  .ai-panel .ai-body{
    font-family:var(--serif);
    font-size:14.5px;
    line-height:1.6;
    color:var(--ink);
  }

  /* =========================================================
     MARKDOWN RENDER STYLES — Bratishka, bu joy juda muhim:
     marked.js xom HTML qaytaradi (<h2>, <strong>, <ul> va h.k.),
     lekin brauzer default stillari bu dark-theme'ga umuman mos
     emas (katta bo'shliqlar, oq bo'lmagan ranglar, notekis list).
     Shu klass AI javob chiqadigan HAR IKKALA joyga (.ai-body va
     .chat-msg.ai) qo'llanadi — pastdagi ".md-content" selectori
     ikkalasini ham qamrab oladi.
  ========================================================= */
  .ai-body, .chat-msg.ai{
    word-wrap:break-word;
    overflow-wrap:break-word;
  }
  .ai-body > *:first-child, .chat-msg.ai > *:first-child{margin-top:0;}
  .ai-body > *:last-child, .chat-msg.ai > *:last-child{margin-bottom:0;}

  .ai-body p, .chat-msg.ai p{
    margin:0 0 10px;
  }
  .ai-body h1, .ai-body h2, .ai-body h3, .ai-body h4,
  .chat-msg.ai h1, .chat-msg.ai h2, .chat-msg.ai h3, .chat-msg.ai h4{
    font-family:var(--mono);
    color:var(--wire-amber);
    letter-spacing:.02em;
    line-height:1.35;
    margin:16px 0 8px;
  }
  .ai-body h1:first-child, .ai-body h2:first-child, .ai-body h3:first-child,
  .chat-msg.ai h1:first-child, .chat-msg.ai h2:first-child, .chat-msg.ai h3:first-child{
    margin-top:0;
  }
  .ai-body h1, .chat-msg.ai h1{font-size:17px;}
  .ai-body h2, .chat-msg.ai h2{font-size:15.5px;}
  .ai-body h3, .ai-body h4, .chat-msg.ai h3, .chat-msg.ai h4{font-size:14px;}

  .ai-body strong, .chat-msg.ai strong{
    color:var(--ink);
    font-weight:700;
  }
  .ai-body em, .chat-msg.ai em{
    color:var(--ink);
    font-style:italic;
  }

  .ai-body ul, .ai-body ol,
  .chat-msg.ai ul, .chat-msg.ai ol{
    margin:0 0 10px;
    padding-left:22px;
  }
  .ai-body li, .chat-msg.ai li{
    margin-bottom:5px;
    line-height:1.55;
  }
  .ai-body li::marker, .chat-msg.ai li::marker{
    color:var(--wire-amber);
  }

  .ai-body a, .chat-msg.ai a{
    color:var(--wire-green);
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .ai-body a:hover, .chat-msg.ai a:hover{
    color:var(--wire-amber);
  }

  .ai-body code, .chat-msg.ai code{
    font-family:var(--mono);
    font-size:.9em;
    background:var(--paper);
    border:1px solid var(--line);
    padding:1px 5px;
    border-radius:3px;
    color:var(--wire-amber);
  }
  .ai-body pre, .chat-msg.ai pre{
    font-family:var(--mono);
    font-size:12.5px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:3px;
    padding:10px 12px;
    overflow-x:auto;
    margin:0 0 10px;
  }
  .ai-body pre code, .chat-msg.ai pre code{
    background:none;
    border:none;
    padding:0;
  }

  .ai-body blockquote, .chat-msg.ai blockquote{
    border-left:2px solid var(--wire-green);
    padding-left:10px;
    margin:0 0 10px;
    color:var(--ink-dim);
    font-style:italic;
  }

  .ai-body hr, .chat-msg.ai hr{
    border:none;
    border-top:1px solid var(--line);
    margin:14px 0;
  }

  .ai-body table, .chat-msg.ai table{
    width:100%;
    border-collapse:collapse;
    margin:0 0 10px;
    font-size:.92em;
  }
  .ai-body th, .ai-body td, .chat-msg.ai th, .chat-msg.ai td{
    border:1px solid var(--line);
    padding:6px 8px;
    text-align:left;
  }
  .ai-body th, .chat-msg.ai th{
    color:var(--wire-amber);
    font-family:var(--mono);
    font-size:.85em;
    text-transform:uppercase;
  }

  .chat-panel{
    margin-top:10px;
    display:none;
  }
  .chat-panel.show{display:block;}
  .chat-log{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:8px;
    max-height:340px;
    overflow-y:auto;
    scrollbar-width:none;       /* Firefox */
    -ms-overflow-style:none;    /* eski Edge */
  }
  .chat-log::-webkit-scrollbar{
    display:none;               /* Chrome, Safari, yangi Edge */
  }
  .chat-msg{
    font-family:var(--serif);
    font-size:13.5px;
    line-height:1.5;
    padding:8px 10px;
    border-radius:2px;
  }
  .chat-msg.user{
    background:var(--paper-raised);
    color:var(--ink);
    align-self:flex-end;
    max-width:85%;
    border:1px solid var(--line);
  }
  .chat-msg.ai{
    background:transparent;
    color:#c9c8bd;
    border-left:2px solid var(--wire-green);
    padding-left:10px;
  }
  .chat-input-row{
    display:flex;
    gap:6px;
  }
  .chat-input-row input{
    flex:1;
    background:var(--paper);
    border:1px solid var(--line);
    color:var(--ink);
    padding:8px 10px;
    font-family:var(--serif);
    font-size:13.5px;
  }
  .chat-input-row input:focus{outline:1px solid var(--wire-amber);}
  .chat-input-row button{
    background:var(--wire-amber);
    border:none;
    color:#0d0d0c;
    padding:0 14px;
    font-family:var(--mono);
    font-weight:700;
    font-size:11px;
    cursor:pointer;
    text-transform:uppercase;
  }
  .chat-input-row button:disabled{opacity:.5; cursor:wait;}

  .placeholder{
    font-family:var(--mono);
    text-align:center;
    padding:60px 20px;
    color:var(--ink-dim);
    font-size:13px;
    line-height:1.8;
  }
  .placeholder .cursor{
    display:inline-block;
    width:8px;height:14px;
    background:var(--wire-amber);
    animation:blink 1s step-end infinite;
    vertical-align:middle;
    margin-left:4px;
  }
  @keyframes blink{50%{opacity:0;}}

  .error-box{
    border:1px solid var(--wire-red);
    background:rgba(194,59,46,.08);
    padding:16px;
    font-family:var(--mono);
    font-size:12px;
    color:#e2a29b;
    line-height:1.6;
  }

  footer{
    text-align:center;
    font-family:var(--mono);
    font-size:10px;
    color:var(--ink-dim);
    padding:24px;
    border-top:1px solid var(--line);
    text-transform:uppercase;
    letter-spacing:.08em;
  }

  .day-list{
    display:flex;
    flex-direction:column;
  }
  .day-btn{
    text-align:left;
    background:transparent;
    border:1px solid var(--line);
    border-bottom:none;
    color:var(--ink);
    font-family:var(--mono);
    font-size:13px;
    text-transform:capitalize;
    padding:14px 16px;
    cursor:pointer;
    transition:.15s;
  }
  .day-list .day-btn:last-child{border-bottom:1px solid var(--line);}
  .day-btn:hover{background:var(--paper-raised); color:var(--wire-amber); border-color:var(--wire-amber);}

  .history-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:18px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .back-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-dim);
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.05em;
    text-transform:uppercase;
    padding:8px 12px;
    cursor:pointer;
    transition:.15s;
  }
  .back-btn:hover{border-color:var(--wire-amber); color:var(--wire-amber);}
  .history-date-label{
    font-family:var(--mono);
    font-size:12px;
    color:var(--wire-amber);
    text-transform:uppercase;
    letter-spacing:.05em;
  }

  @media (max-width:900px){
    main{ grid-template-columns:1fr; }
    aside#trending{ position:static; }
    nav.top-nav{ gap:6px; }
    nav.top-nav .hdr-btn{ padding:8px 10px; font-size:11px; }
  }

  @media (max-width:600px){
    .story{grid-template-columns:1fr; gap:6px;}
    .story-index{display:flex; gap:8px; align-items:center;}
    .story-index .src{margin-top:0;}
    .story.hero h2{ font-size:22px; }
    header{ padding:16px 18px; }
    .control-bar{ padding:10px 18px; }
    main{ padding:20px 18px 60px; }
  }

  /* Markdown render qilingan matn uchun uslub — h2/h3, bold, ro'yxatlar
     ai-body va chat-msg ichida chiroyli chiqsin */
  .ai-body h1, .ai-body h2, .ai-body h3,
  .chat-msg h1, .chat-msg h2, .chat-msg h3{
    font-family:var(--mono);
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--wire-amber);
    margin:14px 0 6px;
  }
  .ai-body p, .chat-msg p{margin:0 0 10px;}

<!--
  Bratan, o'zgarishlar shu yerda:
  1) AI key'lar butunlay frontend'dan olib tashlandi. Endi /api/ai-chat orqali
     chaqiriladi — key'lar Vercel Environment Variables'da turadi, brauzer
     ularni hech qachon ko'rmaydi.
  2) Firestore ulandi (firebase-init.js, type="module"). Feed har yuklanganda
     article'lar bazaga yoziladi (merge), AI tushuntirish natijasi keshlanadi,
     chat tarixi subcollection'da saqlanadi va sahifa yangilansa ham yo'qolmaydi.
  3) firestore.rules faylini alohida bераман — uni Firebase Console yoki CLI
     orqali deploy qilishing kerak, bu faylning ichida emas.
-->
<script type="module">
import {
  hashUrl,
  upsertArticle,
  getArticleDoc,
  saveExplainResult,
  loadChatHistory,
  appendChatMessage,
  saveTranslation,
  packText,
  unpackText,
  articleOriginal,
  articleUz,
  markDay,
  getRecentDays,
  getArticlesByDate,
  getArticlesByDateMode,
  claimNewsSlot,
  finishNewsSlot,
  waitForNewsSlot
} from './firebase-init.js';

(function(){
  // =========================================================
  // 0) MARKDOWN RENDER — AI/tarjima matnini xavfsiz HTML'ga aylantiradi.
  //    marked.js matnni parse qiladi, DOMPurify natijani tozalaydi (XSS'dan
  //    himoya — AI matni to'g'ridan-to'g'ri innerHTML'ga tushadi, shuning
  //    uchun sanitize qilmasdan qo'yib bo'lmaydi).
  //    Agar CDN yuklanmasa (tarmoq xato) — xom matnga fallback qilamiz,
  //    ilova butunlay to'xtab qolmasligi kerak.
  // =========================================================
  function renderMd(el, text){
    const safeText = text || '';
    if(window.marked && window.DOMPurify){
      const html = DOMPurify.sanitize(marked.parse(safeText));
      el.innerHTML = html;
    }else{
      el.textContent = safeText; // fallback — marked/DOMPurify yuklanmagan
    }
  }

  // =========================================================
  // 0.1) STATUS HELPERS
  // =========================================================
  function setAiStatus(text, cls){
    const el = document.getElementById('aiStatus');
    el.textContent = 'AI: ' + text;
    el.className = cls || '';
  }
  function setDbStatus(text, cls){
    const el = document.getElementById('dbStatus');
    el.textContent = 'DB: ' + text;
    el.className = cls || '';
  }
  setAiStatus('SERVER PROXY ORQALI', '');
  setDbStatus('FIRESTORE ULANDI', 'ok');

  // =========================================================
  // 1) AI CALL LAYER — endi server-side proxy orqali.
  //    Fallback zanjiri (groq -> openrouter -> gemini) va key round-robin
  //    logikasi /api/ai-chat.js ichiga ko'chdi. Frontend faqat shu endpoint'ga
  //    messages jo'natadi, qaysi provider ishlaganini bilishi shart emas.
  // =========================================================
  async function aiChat(messages){
    setAiStatus('SO\'ROV YUBORILMOQDA...', '');
    try{
      const res = await fetch('/api/ai-chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages })
      });
      const data = await res.json().catch(() => ({}));
      if(!res.ok){
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      setAiStatus((data.provider || 'AI').toUpperCase() + ' — ISHLADI', 'ok');
      return data.result || '';
    }catch(err){
      setAiStatus('XATOLIK', 'bad');
      throw err;
    }
  }

  // =========================================================
  // 2) GNEWS FEED + FIRESTORE ARXIV
  // =========================================================
  const feedEl = document.getElementById('feed');
  const feedLabel = document.getElementById('feedLabel');
  const feedCount = document.getElementById('feedCount');
  const statusLine = document.getElementById('statusLine');
  const tabs = document.querySelectorAll('.tab-btn');

  let currentMode = 'global';
  let refreshTimer = null;
  let currentArticles = []; // hozirgi feed'dagi maqolalar, {..., id} bilan (id = hashUrl natijasi)

  // "UZ TARJIMA" holati — bu yerda e'lon qilinadi, chunki loadFeed()
  // pastroqdagi translateAllArticles()/originalTexts'ga murojaat qiladi.
  // JS function declaration'lar hoisted bo'ladi, lekin let/const bilan
  // e'lon qilingan o'zgaruvchilar bo'lmaydi — shuning uchun bularni
  // ENG BOSHIDA e'lon qilish kerak, aks holda "Cannot access before
  // initialization" xatosi chiqadi.
  let translateModeOn = false;
  let isTranslating = false;
  const originalTexts = {}; // idx -> { title, desc } — original matnlar

  function tickClock(){
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('uz-UZ', {hour12:false});
  }
  tickClock();
  setInterval(tickClock, 1000);

  tabs.forEach(btn => {
    btn.addEventListener('click', () => {
      tabs.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
      if(currentMode === 'history'){
        feedLabel.textContent = "TARIX — KUNLARNI TANLA";
        renderDayList();
      }else{
        feedLabel.textContent = currentMode === 'global' ? 'GLOBAL FEED' : "O'ZBEKISTON FEED";
        loadFeed();
      }
    });
  });

  // O'zbekiston vaqti (Asia/Tashkent, UTC+5).
  function uzNow(){
    const parts = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Tashkent',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', hour12: false
    }).formatToParts(new Date());
    const g = (t) => parts.find(p => p.type === t).value;
    return {
      dateKey: `${g('year')}-${g('month')}-${g('day')}`,
      hour: Number(g('hour'))
    };
  }

  function todayKey(){
    return uzNow().dateKey;
  }

  function yesterdayKey(dateKey){
    const [y, m, d] = dateKey.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    dt.setUTCDate(dt.getUTCDate() - 1);
    return dt.toISOString().slice(0, 10);
  }

  // 04:00, 12:00, 20:00 dan keyin — shu slot. 00:00–03:59 da kechagi 20:00.
  function currentNewsSlot(){
    const { dateKey, hour } = uzNow();
    if (hour >= 20) return { dateKey, slot: '20' };
    if (hour >= 12) return { dateKey, slot: '12' };
    if (hour >= 4) return { dateKey, slot: '04' };
    return { dateKey: yesterdayKey(dateKey), slot: '20' };
  }

  // "2026-08-27" -> "27-avgust, 2026, payshanba" ko'rinishida chiqaradi.
  function formatDateUz(dateKey){
    const [y, m, d] = dateKey.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return dt.toLocaleDateString('uz-UZ', { day:'2-digit', month:'long', year:'numeric', weekday:'long' });
  }

  // Firestore'da manba ikki xil shaklda kelishi mumkin: live feed'da
  // GNews object ({name: "..."}), tarix'da esa biz saqlagan string.
  // Shu funksiya ikkalasini ham to'g'ri o'qiydi.
  function sourceName(a){
    if(!a.source) return "NOMA'LUM";
    return typeof a.source === 'string' ? (a.source || "NOMA'LUM") : (a.source.name || "NOMA'LUM");
  }

  async function showCachedFeed(dateKey, note){
    const cached = await getArticlesByDateMode(dateKey, currentMode);
    currentArticles = cached.map(cleanArticleText);
    if(!currentArticles.length){
      feedEl.innerHTML = '<div class="placeholder">FIRESTORE\'DA HALI YANGILIK YO\'Q<br>SLOT VAQTI KELGANDA GNEWS\'DAN OLINADI</div>';
      feedCount.textContent = '0 TA YANGILIK';
      statusLine.textContent = note || 'KESH BO\'SH';
      return false;
    }
    renderFeed(currentArticles);
    statusLine.textContent = note || ('FIRESTORE — ' + dateKey + ' / SLOT ' + (currentNewsSlot().slot) + ':00');
    fillMissingUzTranslations(currentArticles).catch(e => console.warn('uzText to\'ldirish:', e.message));
    return true;
  }

  // originalText bor, uzText yo'q — faqat shularni bir marta tarjima qilib saqlaydi.
  async function fillMissingUzTranslations(articles){
    if(!articles || !articles.length) return;
    const missing = [];
    for(const a of articles){
      const orig = articleOriginal(a);
      if(!orig.title) continue;
      if(articleUz(a)) continue;
      try{
        const doc = await getArticleDoc(a.id);
        const uz = articleUz(doc);
        if(uz && uz.title){
          a.uzText = doc.uzText || packText(uz.title, uz.desc);
          a.originalText = doc.originalText || packText(orig.title, orig.desc);
          continue;
        }
        if(doc && !doc.originalText){
          await saveTranslation(a.id, '', '', orig.title, orig.desc);
        }
      }catch(e){}
      missing.push({ a, orig });
    }
    if(!missing.length) return;

    const res = await fetch('/api/translate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        items: missing.map((m, i) => ({ id: i, title: m.orig.title, desc: m.orig.desc })),
        target: 'uz'
      })
    });
    if(!res.ok) return;
    const body = await res.json().catch(() => ({}));
    const translated = body.translations || [];
    await Promise.all(translated.map(async (item) => {
      const m = missing[item.id];
      if(!m) return;
      try{
        await saveTranslation(m.a.id, item.title || '', item.desc || '', m.orig.title, m.orig.desc);
        m.a.uzText = packText(item.title || '', item.desc || '');
        m.a.originalText = packText(m.orig.title, m.orig.desc);
      }catch(e){
        console.warn('uzText saqlanmadi:', e.message);
      }
    }));
    if(translateModeOn){
      currentArticles.forEach((a, i) => {
        const uz = articleUz(a);
        if(uz && uz.title) applyTranslation(i, uz.title, uz.desc);
      });
    }
  }

  async function persistGnewsBatch(rawArticles, dateKey, slot){
    markDay(dateKey).catch(e => console.warn('kun belgisi yozilmadi:', e.message));
    const saved = await Promise.all((rawArticles || []).map(async (a) => {
      const id = await hashUrl(a.url || a.title || Math.random().toString());
      try{
        await upsertArticle(id, { ...a, slot }, currentMode, dateKey);
      }catch(e){
        console.warn('Firestore upsert xato:', e.message);
      }
      return cleanArticleText({ ...a, id, slot });
    }));
    return saved;
  }

  async function fetchGnewsSlot(dateKey, slot){
    const res = await fetch(`/api/gnews?mode=${currentMode}`);
    const data = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    const rawArticles = data.articles || [];
    await persistGnewsBatch(rawArticles, dateKey, slot);
    await finishNewsSlot(dateKey, currentMode, slot, { status: 'done', count: rawArticles.length });
  }

  async function loadFeed(){
    statusLine.textContent = 'YUKLANMOQDA...';
    feedEl.innerHTML = '<div class="placeholder">FIRESTORE TEKSHIRILMOQDA<span class="cursor"></span></div>';

    Object.keys(originalTexts).forEach(k => delete originalTexts[k]);

    const { dateKey, slot } = currentNewsSlot();

    try{
      // 1) Avval bazadan ko'rsatamiz — har kirishda GNews'ga bormaymiz.
      await showCachedFeed(dateKey, 'FIRESTORE — ' + dateKey + ' / ' + slot + ':00');

      // 2) Shu slot allaqachon olingan bo'lsa — GNews umuman chaqirilmaydi.
      let claim;
      try{
        claim = await claimNewsSlot(dateKey, currentMode, slot);
      }catch(e){
        console.warn('slot claim xato:', e.message);
        if(currentArticles.length){
          statusLine.textContent = 'FIRESTORE KESH (SYNC YOZILMADI)';
          return;
        }
        statusLine.textContent = 'GNEWS — BIRINCHI YUKLASH...';
        await fetchGnewsSlot(dateKey, slot);
        await showCachedFeed(dateKey, 'YANGILANDI — FIRESTORE / SLOT ' + slot + ':00');
        return;
      }

      if(claim.action === 'cached'){
        statusLine.textContent = 'FIRESTORE KESH — SLOT ' + slot + ':00 ALLAQACHON OLINGAN';
        return;
      }

      if(claim.action === 'wait'){
        statusLine.textContent = 'BOSHQA SO\'ROV GNEWS OLYAPTI — KUTILMOQDA...';
        const ok = await waitForNewsSlot(dateKey, currentMode, slot);
        await showCachedFeed(dateKey, ok
          ? 'FIRESTORE — YANGI SLOT YUKLANDI'
          : 'FIRESTORE — KUTISH TUGADI');
        return;
      }

      // 3) Faqat shu slotning BIRINCHI tashrifi GNews'ga boradi (kuniga 3 marta).
      statusLine.textContent = 'GNEWS SLOT ' + slot + ':00 — YANGILANMOQDA...';
      try{
        await fetchGnewsSlot(dateKey, slot);
      }catch(err){
        await finishNewsSlot(dateKey, currentMode, slot, { status: 'error', error: err.message }).catch(() => {});
        const hadCache = currentArticles.length > 0;
        if(hadCache){
          statusLine.textContent = 'GNEWS XATO, KESH KO\'RSATILDI: ' + err.message;
          return;
        }
        throw err;
      }

      await showCachedFeed(dateKey, 'YANGILANDI — FIRESTORE / SLOT ' + slot + ':00');
    } catch(err){
      console.error(err);
      feedEl.innerHTML = `<div class="error-box">
        XATOLIK YUZ BERDI: ${escapeHtml(err.message)}<br><br>
        Tekshir: 1) Vercel'da GNEWS_KEY environment variable qo'yilganmi? 2) Kunlik limit (100) tugamadimi? 3) "uz" mamlakati uchun local yangilik kam bo'lishi mumkin — global tab'ni sinab ko'r.
      </div>`;
      statusLine.textContent = 'XATOLIK';
    }
  }

  // opts.history = true bo'lsa, tepaga "kunlar ro'yxatiga qaytish" tugmasi
  // chiqadi — bu funksiya ham live feed, ham tarix kunini bir xil render
  // qiladi (kod takrorlanmasin deb — story markup ikkalasida ham bir xil).
  function renderFeed(articles, opts = {}){
    const backNav = opts.history
      ? `<div class="history-nav">
           <button class="back-btn" id="backToDaysBtn">← KUNLAR RO'YXATIGA QAYTISH</button>
           <span class="history-date-label">${escapeHtml(formatDateUz(opts.date))}</span>
         </div>`
      : '';

    if(!articles.length){
      feedEl.innerHTML = backNav + '<div class="placeholder">BU KUN UCHUN YANGILIK TOPILMADI</div>';
      feedCount.textContent = '0 TA YANGILIK';
      if(opts.history) bindBackButton();
      return;
    }
    feedCount.textContent = articles.length + ' TA YANGILIK';
    // Bratishka, MUHIM: birinchi story (i===0) endi ".hero" klassi bilan
    // chiqadi — katta rasm-o'rni + katta sarlavha, screenshot'dagidek.
    // ID'lar (title-link-${i}, desc-${i} va h.k.) HECH O'ZGARMAGAN — shuning
    // uchun handleExplain/toggleDiscuss/translate logikasi butunlay ishlayveradi.
    feedEl.innerHTML = backNav + articles.map((a, i) => {
      const num = String(i+1).padStart(2,'0');
      const src = sourceName(a);
      const date = a.publishedAt ? new Date(a.publishedAt).toLocaleString('uz-UZ') : '';
      const desc = a.description ? escapeHtml(a.description) : '';
      const isHero = i === 0 && !opts.history;
      const imgUrl = a.image || a.imageUrl || a.urlToImage || '';
      const heroMedia = isHero
        ? (imgUrl
            ? `<div class="hero-media"><img src="${escapeHtml(imgUrl)}" alt="${escapeHtml(a.title || src)}" loading="eager" onerror="this.remove()"></div>`
            : `<div class="hero-media">${escapeHtml(src)}</div>`)
        : '';
      return `
        <article class="story${isHero ? ' hero' : ''}" data-idx="${i}" data-id="${a.id}">
          ${isHero ? heroMedia : ''}
          <div class="story-index">${num}<span class="src">${escapeHtml(src)}</span></div>
          <div>
            <h2 id="title-${i}"><a href="${a.url}" target="_blank" rel="noopener" id="title-link-${i}">${escapeHtml(a.title || 'Sarlavhasiz')}</a></h2>
            <p class="desc" id="desc-${i}">${desc}</p>
            <div class="meta">${date}</div>

            <div class="ai-toolbar">
              <button class="ai-btn" data-action="explain" data-idx="${i}">🇺🇿 Tarjima + Tushuntirish</button>
              <button class="ai-btn" data-action="discuss" data-idx="${i}">💬 Muhokama qilish</button>
            </div>

            <div class="ai-panel" id="ai-panel-${i}">
              <div class="ai-tag"><span>TARJIMA</span><span></span></div>
              <div class="ai-body" id="ai-translate-body-${i}"></div>
              <div class="ai-tag" style="margin-top:12px;"><span>AI TUSHUNTIRISHI</span><span></span></div>
              <div class="ai-body" id="ai-body-${i}"></div>
            </div>

            <div class="chat-panel" id="chat-panel-${i}">
              <div class="chat-log" id="chat-log-${i}"></div>
              <div class="chat-input-row">
                <input type="text" id="chat-input-${i}" placeholder="Bu yangilik haqida savol yoz...">
                <button data-action="send" data-idx="${i}">YUBOR</button>
              </div>
            </div>
          </div>
        </article>`;
    }).join('');

    // Sidebar "ENG KO'P O'QILGANLAR" — haqiqiy o'qilish statistikasi yo'q
    // (buning uchun alohida analytics/Firestore counter kerak bo'lardi),
    // shuning uchun hozircha feed'dagi keyingi 4 ta sarlavhani ko'rsatadi.
    // Bosilsa story'ga scroll qiladi — tashqi link emas, ichki navigatsiya.
    renderTrending(articles);

    feedEl.querySelectorAll('[data-action="explain"]').forEach(btn => {
      btn.addEventListener('click', () => handleExplain(Number(btn.dataset.idx), btn));
    });
    feedEl.querySelectorAll('[data-action="discuss"]').forEach(btn => {
      btn.addEventListener('click', () => toggleDiscuss(Number(btn.dataset.idx)));
    });
    feedEl.querySelectorAll('[data-action="send"]').forEach(btn => {
      btn.addEventListener('click', () => handleSend(Number(btn.dataset.idx)));
    });
    feedEl.querySelectorAll('[id^="chat-input-"]').forEach(input => {
      input.addEventListener('keydown', (e) => {
        if(e.key === 'Enter'){
          const idx = Number(input.id.replace('chat-input-',''));
          handleSend(idx);
        }
      });
    });

    if(opts.history) bindBackButton();

    // Sahifa qayta render bo'lganda — avval shu article uchun keshlangan
    // AI tushuntirish yoki chat tarixi bor-yo'qligini Firestore'dan tekshiramiz.
    articles.forEach((a, i) => restoreCachedState(a.id, i));

    // Agar "UZ TARJIMA" rejimi yoqilgan bo'lsa (masalan foydalanuvchi tab
    // almashtirdi va feed qayta render bo'ldi) — yangi kelgan article'larni
    // ham avtomatik tarjima qilamiz, aks holda faqat eski feed tarjima
    // qolib, yangisi original tilda chiqib qoladi — bu chalkash bo'lardi.
    if(translateModeOn){
      translateAllArticles();
    }
  }

  // Sidebar'ni to'ldiradi: birinchi story'dan keyingi 4 tasini oladi,
  // bosilganda o'sha story'ga smooth scroll qiladi.
  function renderTrending(articles){
    const list = document.getElementById('trending-list');
    if(!list) return;
    const picks = articles.slice(1, 5);
    if(!picks.length){ list.innerHTML = ''; return; }
    list.innerHTML = picks.map((a, k) => {
      const idx = k + 1;
      const uz = articleUz(a);
      const title = (translateModeOn && uz && uz.title)
        ? uz.title
        : (articleOriginal(a).title || a.title || 'Sarlavhasiz');
      return `
      <li>
        <span class="t-num">${idx}.</span>
        <a href="#" id="trend-link-${idx}" data-scroll-idx="${idx}">${escapeHtml(title)}</a>
      </li>`;
    }).join('');
    list.querySelectorAll('[data-scroll-idx]').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const target = document.querySelector(`.story[data-idx="${link.dataset.scrollIdx}"]`);
        if(target) target.scrollIntoView({ behavior:'smooth', block:'start' });
      });
    });
  }

  function bindBackButton(){
    const btn = document.getElementById('backToDaysBtn');
    if(btn) btn.addEventListener('click', () => {
      feedLabel.textContent = "TARIX — KUNLARNI TANLA";
      renderDayList();
    });
  }

  // =========================================================
  // 2b) TARIX — kunlar ro'yxati va tanlangan kun feedi
  // =========================================================
  async function renderDayList(){
    statusLine.textContent = 'TARIX YUKLANMOQDA...';
    feedEl.innerHTML = '<div class="placeholder">YUKLANMOQDA<span class="cursor"></span></div>';
    try{
      const days = await getRecentDays(30);
      const today = todayKey();
      // Faqat BUGUNDAN ORTDA QOLGAN kunlar — bugungi feed live tab'larda
      // allaqachon ko'rinadi, tarixda takrorlashning hojati yo'q.
      const pastDays = days.filter(d => d !== today);

      if(!pastDays.length){
        feedEl.innerHTML = '<div class="placeholder">HALI ARXIVLANGAN KUN YO\'Q<br>ERTAGA QAYTIB KO\'R</div>';
        feedCount.textContent = '0 TA KUN';
        statusLine.textContent = 'TARIX TAYYOR';
        return;
      }

      feedCount.textContent = pastDays.length + ' TA KUN';
      feedEl.innerHTML = `<div class="day-list">${pastDays.map(d =>
        `<button class="day-btn" data-date="${d}">${escapeHtml(formatDateUz(d))}</button>`
      ).join('')}</div>`;
      renderTrending([]); // kunlar ro'yxatida sidebar bo'sh turadi

      feedEl.querySelectorAll('.day-btn').forEach(btn => {
        btn.addEventListener('click', () => loadHistoryDay(btn.dataset.date));
      });
      statusLine.textContent = 'TARIX TAYYOR';
    }catch(err){
      console.error(err);
      feedEl.innerHTML = `<div class="error-box">TARIXNI YUKLASHDA XATOLIK: ${escapeHtml(err.message)}</div>`;
      statusLine.textContent = 'XATOLIK';
    }
  }

  async function loadHistoryDay(dateKey){
    statusLine.textContent = 'YUKLANMOQDA...';
    feedEl.innerHTML = '<div class="placeholder">SO\'ROV YUBORILMOQDA<span class="cursor"></span></div>';
    feedLabel.textContent = formatDateUz(dateKey).toUpperCase();
    try{
      const docs = await getArticlesByDate(dateKey);
      currentArticles = (docs || []).map(cleanArticleText);
      renderFeed(currentArticles, { history: true, date: dateKey });
      statusLine.textContent = 'TARIX — ' + dateKey;
    }catch(err){
      console.error(err);
      feedEl.innerHTML = `<div class="error-box">XATOLIK: ${escapeHtml(err.message)}</div>`;
      statusLine.textContent = 'XATOLIK';
    }
  }

  // Bazadagi eski explainResult va chat tarixini panelga qayta chiqaramiz,
  // shunda foydalanuvchi bir marta AI so'ragan narsani ikkinchi marta pul
  // to'lab (token sarflab) so'ramaydi.
  async function restoreCachedState(articleId, idx){
    try{
      const doc = await getArticleDoc(articleId);
      if(doc && (doc.aiSharh || doc.explainResult)){
        const panel = document.getElementById(`ai-panel-${idx}`);
        const body = document.getElementById(`ai-body-${idx}`);
        const translateBody = document.getElementById(`ai-translate-body-${idx}`);
        const btn = document.querySelector(`[data-action="explain"][data-idx="${idx}"]`);
        if(panel && body){
          if(translateBody){
            const uz = articleUz(doc);
            const tTitle = uz?.title || '';
            const tDesc = uz?.desc || '';
            renderMd(translateBody, tTitle + (tDesc ? ('\n\n' + tDesc) : ''));
          }
          renderMd(body, doc.aiSharh || doc.explainResult);
          panel.classList.add('show');
          if(btn) btn.textContent = '🇺🇿 Tarjima + Tushuntirish (keshdan)';
        }
      }
      if(doc && Array.isArray(doc.aiMuhokama) && doc.aiMuhokama.length){
        const chatPanel = document.getElementById(`chat-panel-${idx}`);
        const log = document.getElementById(`chat-log-${idx}`);
        if(chatPanel && log && !log.childElementCount){
          doc.aiMuhokama
            .slice()
            .sort((a, b) => (a.createdAtMs || 0) - (b.createdAtMs || 0))
            .forEach(msg => {
              appendChatMsg(log, msg.role === 'user' ? 'user' : 'ai', msg.content);
            });
        }
      }
    }catch(e){
      console.warn('Firestore restore xato:', e.message);
    }
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // GNews/tarjima ba'zan "o&#39;zining" kabi entity qoldiradi —
  // ekronga va AI'ga xom entity ketmasin.
  function decodeHtml(str){
    if(!str) return '';
    const ta = document.createElement('textarea');
    ta.innerHTML = String(str);
    return ta.value;
  }

  function cleanArticleText(a){
    if(!a) return a;
    if(a.title) a.title = decodeHtml(a.title);
    if(a.description) a.description = decodeHtml(a.description);
    if(a.translatedTitle) a.translatedTitle = decodeHtml(a.translatedTitle);
    if(a.translatedDesc) a.translatedDesc = decodeHtml(a.translatedDesc);
    if(a.originalText) a.originalText = decodeHtml(a.originalText);
    if(a.uzText) a.uzText = decodeHtml(a.uzText);
    return a;
  }

  // =========================================================
  // 3) "TARJIMA + TUSHUNTIRISH"
  //    Ikki bosqich, ikkalasi ham bir marta ishlaydi, natija Firestore'da
  //    keshlanadi:
  //    1-bosqich: /api/translate (Google Translate, AI EMAS, bepul) —
  //               sarlavha+tavsifni o'zbekchaga tarjima qiladi, ekranda
  //               tepada ko'rsatiladi.
  //    2-bosqich: Groq (/api/ai-chat) — o'sha tarjima asosida batafsil
  //               tushuntirish yozadi (auto-detect qilib, har doim o'zbekcha
  //               javob beradi).
  //    Ikkalasi ham tugagach bittada Firestore'ga yoziladi. Keyingi safar
  //    tugma bosilganda — yoki sahifa qayta ochilganda (restoreCachedState) —
  //    Firestore'da explainResult borligi tekshiriladi va bor bo'lsa
  //    /api/translate HAM, Groq HAM UMUMAN CHAQIRILMAYDI, faqat DOM'ga
  //    keshdagi matn qo'yiladi.
  // =========================================================
  async function handleExplain(idx, btn){
    const a = currentArticles[idx];
    if(!a) return;
    const panel = document.getElementById(`ai-panel-${idx}`);
    const body = document.getElementById(`ai-body-${idx}`);
    const translateBody = document.getElementById(`ai-translate-body-${idx}`);

    btn.disabled = true;
    panel.classList.add('show');

    // 0-qadam: Firestore keshini tekshiramiz — bor bo'lsa na tarjima,
    // na Groq chaqirilmaydi, to'g'ridan-to'g'ri keshdan chiqadi.
    try{
      const cached = await getArticleDoc(a.id);
      if(cached && (cached.aiSharh || cached.explainResult)){
        const uz = articleUz(cached);
        const tTitle = uz?.title || '';
        const tDesc = uz?.desc || '';
        renderMd(translateBody, tTitle + (tDesc ? ('\n\n' + tDesc) : ''));
        renderMd(body, cached.aiSharh || cached.explainResult);
        btn.style.display = 'none';
        return;
      }
    }catch(e){
      console.warn('Kesh tekshirishda xato (davom etamiz):', e.message);
    }

    // 1-qadam: haqiqiy tarjima (Google Translate, key kerak emas, Groq bilan
    // aloqasi yo'q — shuning uchun Groq band bo'lsa ham bu qadam ishlaydi).
    btn.textContent = '⏳ TARJIMA QILINMOQDA...';
    translateBody.textContent = 'Tarjima qilinmoqda...';
    body.textContent = '';

    const orig = articleOriginal(a);
    let titleUz = orig.title;
    let descUz = orig.desc;
    try{
      const cachedDoc = await getArticleDoc(a.id);
      const cachedUz = articleUz(cachedDoc || a);
      if(cachedUz && cachedUz.title){
        titleUz = cachedUz.title;
        descUz = cachedUz.desc;
      }else{
        const res = await fetch('/api/translate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            items: [{ id: 0, title: orig.title, desc: orig.desc }],
            target: 'uz'
          })
        });
        const tBody = await res.json().catch(() => ({}));
        if(!res.ok) throw new Error(tBody.error || `Tarjima xatoligi (HTTP ${res.status})`);
        const t = (tBody.translations || [])[0];
        if(t){ titleUz = t.title || titleUz; descUz = t.desc || descUz; }
        await saveTranslation(a.id, titleUz, descUz, orig.title, orig.desc);
        a.uzText = packText(titleUz, descUz);
        a.originalText = packText(orig.title, orig.desc);
      }
      renderMd(translateBody, titleUz + (descUz ? ('\n\n' + descUz) : ''));
    }catch(err){
      renderMd(translateBody, 'Tarjima qilinmadi (' + err.message + '), asl matn bilan davom etamiz.');
    }

    // 2-qadam: Groq — endi asl matn emas, TARJIMA QILINGAN o'zbekcha matn
    // asosida ishlaydi. Til qanday bo'lishidan qat'i nazar (auto-detect),
    // javobni har doim faqat o'zbek tilida yozishi qattiq talab qilinadi.
    btn.textContent = '⏳ TUSHUNTIRILMOQDA...';
    body.textContent = 'AI javob tayyorlayapti...';

    const sys = `Sen tajribali xalqaro yangiliklar sharhlovchisisan. Foydalanuvchi senga allaqachon o'zbek tiliga tarjima qilingan sarlavha va tavsifni beradi (lekin asl til har xil bo'lishi mumkin — ingliz, rus va h.k., buni avtomatik aniqlab ol). Javobingni QATIYAN FAQAT O'ZBEK TILIDA yoz, boshqa hech qanday tilda emas. Quyidagi tartibda javob ber:
1) 3-5 gapli batafsil tushuntirish: nima bo'ldi, nega muhim, fon (context)
2) Agar tegishli bo'lsa — bu voqea nimaga olib kelishi mumkinligi haqida qisqa fikr
Sodda, tushunarli, lekin professional uslubda yoz. Sarlavhani qayta tarjima qilib o'tirma — foydalanuvchi uni allaqachon ko'rgan, sen faqat tushuntir.`;

    const userMsg = `Sarlavha (o'zbekcha): ${titleUz}\nTavsif (o'zbekcha): ${descUz}\nManba: ${sourceName(a)}`;

    try{
      const result = await aiChat([
        { role: 'system', content: sys },
        { role: 'user', content: userMsg }
      ]);
      renderMd(body, result || 'AI bo\'sh javob qaytardi.');
      btn.style.display = 'none';

      // Natijani (tarjima + tushuntirish) birgalikda Firestore'ga yozamiz —
      // keyingi safar shu article uchun 0-qadam buni topadi va na tarjima,
      // na Groq qayta chaqirilmaydi.
      try{
        const origSave = articleOriginal(a);
        await saveTranslation(a.id, titleUz, descUz, origSave.title, origSave.desc);
        await saveExplainResult(a.id, result || '');
      }catch(e){
        console.warn('explainResult/tarjima saqlanmadi:', e.message);
      }

    }catch(err){
      // Bratishka, MUHIM: xato bo'lganda tugmani yashirmaymiz — aks holda
      // odam qayta urinib ko'ra olmay qoladi. Faqat muvaffaqiyatda yo'qoladi.
      body.textContent = 'XATOLIK: ' + err.message;
      btn.textContent = '🇺🇿 Tarjima + Tushuntirish';
      btn.disabled = false;
    }
  }

  // =========================================================
  // 4) "MUHOKAMA QILISH" — chat tarixi endi Firestore subcollection'da.
  //    RAM'dagi chatHistories — shu sessiya davomidagi ishchi nusxa,
  //    lekin har xabar Firestore'ga ham yoziladi, sahifa yangilansa yo'qolmaydi.
  // =========================================================
  const chatHistories = {}; // idx -> [{role, content}]  (system prompt shu yerda saqlanadi, DB'ga yozilmaydi)
  const chatLoaded = {};    // idx -> bool, DB'dan tarix bir marta yuklandimi

  async function toggleDiscuss(idx){
    const panel = document.getElementById(`chat-panel-${idx}`);
    const wasHidden = !panel.classList.contains('show');
    panel.classList.toggle('show');
    if(!wasHidden) return; // yopilyapti — qayta yuklash shart emas

    const a = currentArticles[idx];
    if(!chatHistories[idx]){
      const topicTitle = decodeHtml(a.title || '');
      const topicDesc = decodeHtml(a.description || '');
      chatHistories[idx] = [
        { role: 'system', content: `Sen FAQAT shu bitta yangilik haqida gaplashadigan suhbatdoshisan.

ICHKI KONTEKST (bu matnni foydalanuvchiga hech qachon to'liq o'qib berma, shunchaki biling):
Sarlavha: ${topicTitle}
Tavsif: ${topicDesc}

QATIY USLUB:
1) To'liq sarlavhani yoki tavsifni so'zma-so'z takrorlama. Uzun yangilik nomini gapning o'rtasiga tiqma.
2) Salom / "nima bu" / "nima gap" kabi qisqa xabarda: 2-4 ta asosiy ot (kim va nima) bilan QISQA, tabiiy savol ber.
   YAXSHI: "Salom! Cursor Origin haqida bilmoqchimisiz?"
   YAXSHI: "Salom! GitHub ishlamagan paytdagi Origin chiqishi qiziqtirdimi?"
   YOMON: "Salom! GitHub ishlamay qolganda, Cursor o'zining hamkasbi Originni ishga tushirdi, bu haqda nimani muhokama qilmoqchisiz?"
3) "Qanday yordam bera olaman?" kabi umumiy yordamchi ohangida yozma. Mavzuni 1 qisqa savol bilan och.
4) Boshqa mavzuga o'tishsa, muloyimlik bilan shu yangilikka qaytar — lekin yana to'liq sarlavhani aytma.
5) Javoblaring o'zbekcha, qisqa-tabiiy, keyin savolga qarab chuqurlash. Faktlarga tayan.` }
      ];
    }

    if(!chatLoaded[idx]){
      chatLoaded[idx] = true;
      const log = document.getElementById(`chat-log-${idx}`);
      try{
        const history = await loadChatHistory(a.id); // [{role, content, createdAt}]
        history.forEach(msg => {
          chatHistories[idx].push({ role: msg.role, content: msg.content });
          appendChatMsg(log, msg.role === 'user' ? 'user' : 'ai', msg.content);
        });
      }catch(e){
        console.warn('Chat tarixi yuklanmadi:', e.message);
      }
    }
  }

  async function handleSend(idx){
    const input = document.getElementById(`chat-input-${idx}`);
    const log = document.getElementById(`chat-log-${idx}`);
    const btn = document.querySelector(`[data-action="send"][data-idx="${idx}"]`);
    const text = input.value.trim();
    if(!text) return;

    const a = currentArticles[idx];
    if(!chatHistories[idx]) await toggleDiscuss(idx);

    appendChatMsg(log, 'user', text);
    chatHistories[idx].push({ role: 'user', content: text });
    input.value = '';
    input.disabled = true;
    btn.disabled = true;

    // Firestore'ga yozamiz — kutmasdan (UI bloklanmasin), lekin xatoni log qilamiz.
    appendChatMessage(a.id, 'user', text).catch(e => console.warn('chat write xato:', e.message));

    const thinkingEl = appendChatMsg(log, 'ai', 'AI yozmoqda...');

    try{
      const result = await aiChat(chatHistories[idx]);
      thinkingEl.textContent = result;
      chatHistories[idx].push({ role: 'assistant', content: result });
      appendChatMessage(a.id, 'assistant', result).catch(e => console.warn('chat write xato:', e.message));
    }catch(err){
      thinkingEl.textContent = 'XATOLIK: ' + err.message;
    }finally{
      input.disabled = false;
      btn.disabled = false;
      input.focus();
      log.scrollTop = log.scrollHeight;
    }
  }

  function appendChatMsg(log, role, text){
    const div = document.createElement('div');
    div.className = 'chat-msg ' + role;
    // Bratishka, MUHIM: faqat AI xabari markdown sifatida render qilinadi.
    // User yozgan matnni HAR DOIM xom textContent qilib qo'yamiz — u odam
    // yozgan matn, uni HTML/markdown deb parse qilishning hojati yo'q va
    // xavfsizlik nuqtai nazaridan ham to'g'ri emas.
    if(role === 'ai'){
      renderMd(div, text);
    }else{
      div.textContent = text;
    }
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  // =========================================================
  // 5) "UZ TARJIMA" TOGGLE — barcha ko'rinayotgan article'larni
  //    bitta AI so'rovda (batch) tarjima qilamiz, qayta bossa
  //    asl (original) matnga qaytaramiz. AI qayta chaqirilmaydi —
  //    original matn xotirada saqlanadi.
  // =========================================================
  const translateBtn = document.getElementById('translateAllBtn');
  const translateLabel = document.getElementById('translateAllLabel');

  translateBtn.addEventListener('click', () => {
    if(isTranslating) return; // AI javob kutayotganda qayta bosishni bloklaymiz
    if(translateModeOn){
      revertTranslation();
    }else{
      translateAllArticles();
    }
  });

  // Original matnni original tilga qaytaradi — AI kerak emas, tezkor.
  function revertTranslation(){
    currentArticles.forEach((a, i) => {
      const orig = originalTexts[i];
      if(!orig) return;
      const titleLink = document.getElementById(`title-link-${i}`);
      const descEl = document.getElementById(`desc-${i}`);
      if(titleLink){
        titleLink.textContent = orig.title;
        titleLink.parentElement.classList.remove('translated');
      }
      const trend = document.getElementById(`trend-link-${i}`);
      if(trend) trend.textContent = orig.title;
      if(descEl){
        descEl.textContent = orig.desc;
        descEl.classList.remove('translated');
        const badge = descEl.parentElement.querySelector('.translated-badge');
        if(badge) badge.remove();
      }
    });
    translateModeOn = false;
    translateBtn.classList.remove('active');
    translateLabel.textContent = 'UZ TARJIMA';
  }

  // DOM'ga tarjima matnini qo'yadi + "translated" belgisini yoqadi.
  // Ham keshdan (Firestore) kelgan, ham yangi AI natijasi shu orqali chiqadi.
  function applyTranslation(i, title, desc){
    title = decodeHtml(title || '');
    desc = decodeHtml(desc || '');
    const titleLink = document.getElementById(`title-link-${i}`);
    const descEl = document.getElementById(`desc-${i}`);
    if(titleLink && title){
      titleLink.textContent = title;
      titleLink.parentElement.classList.add('translated');
    }
    const trend = document.getElementById(`trend-link-${i}`);
    if(trend && title) trend.textContent = title;
    if(descEl && desc){
      descEl.textContent = desc;
      descEl.classList.add('translated');
      if(!descEl.parentElement.querySelector('.translated-badge')){
        const badge = document.createElement('span');
        badge.className = 'translated-badge';
        badge.textContent = '(tarjima)';
        descEl.after(badge);
      }
    }
  }

  // Barcha ko'rinayotgan article'larni tarjima qiladi — LEKIN avval Firestore'dan
  // tekshiradi: bu article ilgari tarjima qilingan bo'lsa (translatedTitle mavjud),
  // AI UMUMAN CHAQIRILMAYDI, keshdan to'g'ridan-to'g'ri chiqadi. Faqat hali
  // tarjima qilinmagan article'lar bitta batch AI so'rovga tushadi (token tejash —
  // 15 ta alohida so'rov o'rniga bitta prompt).
  // Natija darhol Firestore'ga yoziladi — ertaga shu yangilik "tarix"da ochilsa ham
  // qayta tarjima qilinmaydi, chunki translatedTitle/translatedDesc doc'ida saqlanadi.
  async function translateAllArticles(){
    if(!currentArticles.length) return;
    isTranslating = true;
    translateBtn.classList.add('loading');
    translateLabel.textContent = 'TARJIMA QILINMOQDA...';

    // Original matnlarni saqlab qo'yamiz (agar hali saqlanmagan bo'lsa) —
    // shunda keyinchalik "qaytarish" tugmasi qayerga qaytishni biladi.
    currentArticles.forEach((a, i) => {
      if(!originalTexts[i]){
        originalTexts[i] = articleOriginal(a);
      }
    });

    try{
      const cacheChecks = await Promise.all(currentArticles.map(async (a) => {
        try{
          const doc = await getArticleDoc(a.id);
          const uz = articleUz(doc || a);
          return (uz && uz.title) ? uz : null;
        }catch(e){
          return articleUz(a);
        }
      }));

      const needsAiIdx = [];
      currentArticles.forEach((a, i) => {
        const cached = cacheChecks[i];
        if(cached){
          applyTranslation(i, cached.title, cached.desc); // AI chaqirilmadi — bepul, tezkor
        }else{
          needsAiIdx.push(i);
        }
      });

      // 2-qadam: faqat keshda YO'Q bo'lganlarni tarjima API'ga yuboramiz.
      // MUHIM: bu AI EMAS — /api/translate alohida, haqiqiy tarjima xizmati.
      // Groq/AI faqat "Muhokama qilish" chatida ishlatiladi, tarjimada YO'Q.
      if(needsAiIdx.length){
        const payload = needsAiIdx.map(i => ({
          id: i,
          title: originalTexts[i].title,
          desc: originalTexts[i].desc
        }));

        const res = await fetch('/api/translate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items: payload, target: 'uz' })
        });
        const body = await res.json().catch(() => ({}));
        if(!res.ok){
          throw new Error(body.error || `Tarjima xatoligi (HTTP ${res.status})`);
        }

        const translated = body.translations;
        if(!Array.isArray(translated)){
          throw new Error('Tarjima xizmati massiv qaytarmadi.');
        }

        // 3-qadam: DOM'ga chiqaramiz VA Firestore'ga yozamiz — shunda keyingi safar
        // shu article uchun bu qadam butunlay o'tkazib yuboriladi (1-qadamda kesh topiladi).
        await Promise.all(translated.map(async (item) => {
          const i = item.id;
          applyTranslation(i, item.title, item.desc);
          const a = currentArticles[i];
          if(!a) return;
          try{
            const orig = originalTexts[i] || articleOriginal(a);
            await saveTranslation(a.id, item.title || '', item.desc || '', orig.title, orig.desc);
            a.uzText = packText(item.title || '', item.desc || '');
            a.originalText = packText(orig.title, orig.desc);
          }catch(e){
            console.warn('tarjima Firestore\'ga saqlanmadi:', e.message);
          }
        }));
      }

      translateModeOn = true;
      translateBtn.classList.add('active');
      translateLabel.textContent = 'ORIGINAL TILGA QAYTARISH';
    }catch(err){
      console.error('Translate all xato:', err);
      statusLine.textContent = 'TARJIMA XATOLIGI: ' + err.message;
      translateLabel.textContent = 'UZ TARJIMA';
    }finally{
      isTranslating = false;
      translateBtn.classList.remove('loading');
    }
  }

  // =========================================================
  // 6) AUTO REFRESH + INIT
  // =========================================================
  function scheduleRefresh(){
    if(refreshTimer) clearInterval(refreshTimer);
    // Bratishka, MUHIM: agar foydalanuvchi hozir TARIX'ni ko'rib o'tirgan bo'lsa,
    // 30 daqiqalik auto-refresh loadFeed()ni chaqirib, ekranini "bugungi feed"ga
    // almashtirib yubormasligi kerak edi — shu yerda guard qo'yilmasa, odam
    // 3 kun oldingi yangilikni o'qiyotganda ekran birdan sakrab ketardi.
    refreshTimer = setInterval(() => {
      if(currentMode === 'global' || currentMode === 'local') loadFeed();
    }, 30 * 60 * 1000);
  }

  loadFeed();
  scheduleRefresh();
})();
</script>
